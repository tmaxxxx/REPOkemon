<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@property --mx { syntax: '<percentage>'; inherits: true; initial-value: 50%; }
@property --my { syntax: '<percentage>'; inherits: true; initial-value: 50%; }

:root {
  --bg: #0b0d17;
  --bg2: #151826;
  --surface: #ffffff07;
  --line: #ffffff12;
  --gold: #f0c674;
  --gold2: #c99a3c;
  --txt: #eceef6;
  --muted: #8b90a6;
  --green: #5ad19a;
  --red: #f2708a;
  --cw: min(300px, 68vw, calc((100vh - 310px) * 63 / 88));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  color: var(--txt);
  background:
    radial-gradient(1100px 650px at 50% 30%, #222a5c40, transparent 70%),
    radial-gradient(900px 500px at 90% 110%, #5b3a8a1c, transparent 70%),
    var(--bg);
  background-attachment: fixed;
  overflow-x: hidden;
  user-select: none;
}
button { font: inherit; cursor: pointer; }

/* ---------- Header ---------- */
header {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 12px 24px; margin-bottom: 14px;
  position: sticky; top: 0; z-index: 20;
  background: #0b0d17d0; border-bottom: 1px solid var(--line);
  backdrop-filter: blur(16px);
}
.logo { font-weight: 800; letter-spacing: -.02em; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.logo b { color: var(--gold); }
nav { display: flex; gap: 4px; background: #ffffff06; padding: 4px; border-radius: 999px; flex-wrap: wrap; box-shadow: inset 0 0 0 1px var(--line); }
nav button {
  border: 0; background: transparent; color: var(--muted); padding: 7px 16px; border-radius: 999px; font-weight: 600; font-size: 14px;
  transition: .2s;
}
nav button:hover { color: var(--txt); }
nav button.on { background: #ffffff14; color: var(--txt); }
nav button .badge[hidden] { display: none; }
nav button .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--gold); color: #1d1606; font-size: 11px; line-height: 18px; }
.wallet { display: flex; gap: 12px; align-items: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.wallet .money {
  font-weight: 700; letter-spacing: -.01em; font-size: 16px; color: var(--green);
  background: #5ad19a10; padding: 6px 12px; border-radius: 10px; box-shadow: inset 0 0 0 1px #5ad19a30;
  transition: transform .15s;
}
.wallet .money.bump { transform: scale(1.12); }
.wallet .money.bad { color: var(--red); background: #f2708a10; box-shadow: inset 0 0 0 1px #f2708a40; }
.wallet .coll { color: var(--muted); font-size: 12px; font-weight: 500; line-height: 1.25; }
.wallet .coll b { color: var(--txt); }

main { padding: 0 16px 40px; }
section[hidden] { display: none !important; }

/* ---------- Stage ---------- */
#stage {
  position: relative;
  height: calc(100vh - 230px); min-height: 460px;
  display: grid; place-items: center;
}
.hint {
  text-align: center; color: var(--muted); font-weight: 600; min-height: 1.4em; margin-top: 4px;
  letter-spacing: .3px;
}
.controls[hidden] { display: none; }
.controls { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.btn {
  border: 0; border-radius: 12px; padding: 11px 20px; font-weight: 700; font-size: 15px; color: #1d1606;
  background: var(--gold); box-shadow: 0 8px 24px -10px #f0c674aa;
  transition: transform .15s, filter .15s, background .15s;
}
.btn:hover { filter: brightness(1.07); }
.btn:active { transform: scale(.97); }
.btn.ghost { background: #ffffff0a; color: var(--txt); box-shadow: inset 0 0 0 1px #ffffff1c; }
.btn.ghost:hover { background: #ffffff12; }
.btn.green { background: var(--green); color: #06231a; box-shadow: 0 8px 24px -10px #5ad19aaa; }
.btn.small { padding: 7px 13px; border-radius: 10px; font-size: 13px; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn.nope { animation: nope .4s; }
@keyframes nope { 20%, 60% { translate: -6px 0; } 40%, 80% { translate: 6px 0; } }

/* ---------- Choix du booster ---------- */
.picker { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 4px 0 6px; }
.pchip {
  display: flex; align-items: center; gap: 8px; border: 0; background: var(--surface); color: var(--txt);
  padding: 5px 12px 5px 6px; border-radius: 12px; font-weight: 600; font-size: 13px;
  box-shadow: inset 0 0 0 1px var(--line); transition: .2s;
}
.pchip.free { box-shadow: inset 0 0 0 1px #5ad19a66; }
.pchip.free.on { background: #5ad19a14; box-shadow: inset 0 0 0 1px var(--green); }
.pchip.free b { color: var(--green); }
.pchip.free .gift { font-size: 24px; width: 30px; text-align: center; }
.pchip.free select { font: inherit; font-size: 12px; font-weight: 600; color: var(--txt); background: #ffffff10; border: 0; border-radius: 6px; padding: 3px 4px; margin-left: 4px; }
.pchip.wait { opacity: .7; cursor: default; }
.nextunlock { text-align: center; color: var(--muted); font-size: 13px; font-weight: 500; margin-top: 2px; }
.nextunlock b { color: var(--txt); }
.lockbox { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); border-radius: 14px; padding: 12px 16px; font-weight: 600; color: var(--muted); font-size: 14px; }
.lockbox b { color: var(--txt); }
.lockbox .bar { width: 220px; }
.pchip img { height: 34px; display: block; filter: drop-shadow(0 3px 4px #0008); }
.pchip b { color: var(--gold); }
.pchip.on { background: #ffffff10; box-shadow: inset 0 0 0 1px #f0c67499; }
.pchip[disabled] { opacity: .35; pointer-events: none; }
.pchip.free { cursor: pointer; }
.nopack { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; color: var(--muted); font-weight: 600; }
.nopack .big { font-weight: 700; letter-spacing: -.02em; font-size: 24px; color: var(--txt); }

/* ---------- Booster (vraie photo, coupée en deux pour la déchirure) ---------- */
.pack {
  --cut: .13;
  position: absolute; height: calc(var(--cw) * 88 / 63 * 1.06); aspect-ratio: var(--ar, .55);
  cursor: grab; touch-action: none; perspective: 1100px;
  animation: float 3.2s ease-in-out infinite;
  filter: drop-shadow(0 30px 40px #000a);
}
.pack.gone { display: none; }
/* le booster arrête de flotter sous la souris : les pointillés restent sous le curseur */
.pack:not(.shake):not(.opening):hover { animation-play-state: paused; }
.pack.near, .pack.tearing { cursor: ew-resize; }
.pack.spinning { cursor: grabbing; }
.pack:hover { filter: drop-shadow(0 30px 40px #000a) brightness(1.06); }
.pack.near .tearline, .pack.tearing .tearline { opacity: 1; filter: drop-shadow(0 0 6px #fff); }
@keyframes float { 0%,100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-14px) rotate(1.5deg); } }
.pack.shake { animation: shake .5s linear; }
@keyframes shake {
  0%,100% { transform: translate(0) rotate(0); }
  20% { transform: translate(-6px, 2px) rotate(-3deg); }
  40% { transform: translate(6px, -2px) rotate(3deg); }
  60% { transform: translate(-4px, 1px) rotate(-2deg); }
  80% { transform: translate(4px, -1px) rotate(2deg); }
}
/* booster en 3D : il s'incline vers la souris, a une épaisseur et un dos, et on peut le faire tourner */
.pack3d { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); }
.pack-top, .pack-body { position: absolute; left: 0; right: 0; background-image: var(--pimg); background-repeat: no-repeat; backface-visibility: hidden; }
/* calques et dos assombris par un voile, découpé à la forme du booster */
.pack-layer, .pack-back {
  position: absolute; inset: 0; background: linear-gradient(var(--shade), var(--shade)), var(--pimg) center / 100% 100% no-repeat;
  -webkit-mask: var(--pimg) center / 100% 100% no-repeat; mask: var(--pimg) center / 100% 100% no-repeat; transition: opacity .3s;
}
.pack-layer { --shade: #000000b0; transform: translateZ(var(--z)); }
.pack-back { --shade: #0b0f1fa0; transform: translateZ(-7px) rotateY(180deg); backface-visibility: hidden; }
/* reflet de lumière qui suit l'inclinaison */
.pack-glare {
  position: absolute; inset: 0; pointer-events: none; transform: translateZ(.5px); backface-visibility: hidden;
  background: radial-gradient(circle at var(--gx, 50%) var(--gy, 30%), #ffffff59, #ffffff14 28%, transparent 55%);
  -webkit-mask: var(--pimg) center / 100% 100% no-repeat; mask: var(--pimg) center / 100% 100% no-repeat; transition: opacity .3s;
}
.pack.opening .pack-layer, .pack.opening .pack-back, .pack.opening .pack-glare { opacity: 0; }
.pack-top { top: 0; height: calc(var(--cut) * 100%); background-size: 100% calc(100% / var(--cut)); background-position: top;
  transition: transform .7s cubic-bezier(.5,-0.3,.6,1), opacity .7s; }
.pack-body { top: calc(var(--cut) * 100%); bottom: 0; background-size: 100% calc(100% / (1 - var(--cut))); background-position: bottom;
  transition: transform .8s cubic-bezier(.6,0,.8,.4), opacity .8s; }
/* reflet métallisé qui passe sur l'emballage (masqué par la forme du booster) */
.pack-top::after, .pack-body::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(120deg, transparent 30%, #ffffff66 45%, transparent 60%) no-repeat;
  background-size: 250% 100%; mix-blend-mode: overlay;
  animation: sweep 3.5s ease-in-out infinite;
}
.pack-top::after { -webkit-mask: var(--pimg) top / 100% calc(100% / var(--cut)) no-repeat; mask: var(--pimg) top / 100% calc(100% / var(--cut)) no-repeat; }
.pack-body::after { -webkit-mask: var(--pimg) bottom / 100% calc(100% / (1 - var(--cut))) no-repeat; mask: var(--pimg) bottom / 100% calc(100% / (1 - var(--cut))) no-repeat; }
@keyframes sweep { 0% { background-position: 130% 0; } 60%,100% { background-position: -130% 0; } }
.tearline {
  position: absolute; left: 3%; right: 3%; bottom: 0; height: 3px;
  background: repeating-linear-gradient(90deg, #fff 0 6px, transparent 6px 11px); opacity: .7;
}
.tearprog {
  position: absolute; left: 3%; bottom: -2px; height: 7px; width: 0; max-width: 94%; pointer-events: none;
  background: #fff; box-shadow: 0 0 14px #fff, 0 0 30px var(--gold); border-radius: 4px;
}
.pack.opening .pack-top { transform: translate(40%, -160%) rotate(28deg); opacity: 0; }
.pack.opening .pack-body { transform: translateY(85%); opacity: 0; transition-delay: .45s; }
.pack.opening { animation: none; }

/* ---------- Réserve : produits scellés en 3D, à partir des vraies photos ---------- */
.obj { position: relative; height: 170px; aspect-ratio: var(--ar, .7); perspective: 900px; filter: drop-shadow(0 16px 20px #0009); }
.o3d { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .3s ease-out; }
.obj.live .o3d { transition: none; }
.oface { position: absolute; inset: 0; background: var(--img) center / 100% 100% no-repeat; backface-visibility: hidden; }
/* la photo est coupée en deux : le haut sert de couvercle à l'ouverture */
.otop { clip-path: inset(0 0 69.5% 0); transition: transform .7s cubic-bezier(.5,-0.3,.6,1), opacity .7s; }
.obot { clip-path: inset(30% 0 0 0); transition: transform .8s cubic-bezier(.6,0,.8,.4) .35s, opacity .8s .35s; }
.olayer, .oback {
  position: absolute; inset: 0; background: linear-gradient(var(--shade), var(--shade)), var(--img) center / 100% 100% no-repeat;
  -webkit-mask: var(--img) center / 100% 100% no-repeat; mask: var(--img) center / 100% 100% no-repeat; transition: opacity .2s;
}
.olayer { --shade: #000000b0; transform: translateZ(var(--z)); }
.oback { --shade: #0b0f1fa0; transform: translateZ(var(--z)) rotateY(180deg); backface-visibility: hidden; }
.oglare {
  position: absolute; inset: 0; pointer-events: none; transform: translateZ(.5px); backface-visibility: hidden;
  background: radial-gradient(circle at var(--gx, 50%) var(--gy, 30%), #ffffff59, #ffffff14 28%, transparent 55%);
  -webkit-mask: var(--img) center / 100% 100% no-repeat; mask: var(--img) center / 100% 100% no-repeat; transition: opacity .3s;
}
.obj.shakeo { animation: shake .5s linear; }
.obj.lidoff .otop { transform: translateY(-140%) rotateX(55deg); opacity: 0; }
.obj.lidoff .obot { transform: translateY(45%); opacity: 0; }
.obj.lidoff .olayer, .obj.lidoff .oback, .obj.lidoff .oglare { opacity: 0; }

.rhead { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-top: 8px; }
.rhead h2 { font-weight: 800; letter-spacing: -.03em; font-size: 30px; margin: 0; }
.rhead .rsub { color: var(--muted); font-weight: 600; }
.rhead .rsub b { color: var(--txt); }
.shelf { margin-top: 30px; }
.shelf-t { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; }
.shelf-t i { width: 10px; height: 10px; border-radius: 50%; }
.shelf-row {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 26px 34px; padding: 26px 24px 0;
  background: linear-gradient(transparent 60%, #ffffff06); border-bottom: 10px solid #ffffff10; border-radius: 0 0 6px 6px;
  box-shadow: 0 16px 24px -14px #000d;
}
.ritem { position: relative; background: none; border: 0; padding: 0 0 12px; color: inherit; font: inherit; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px; }
.ritem .obj { margin-bottom: 8px; }
.ritem:hover .obj { filter: drop-shadow(0 22px 26px #000b) brightness(1.06); }
.ritem .rn { position: absolute; top: -8px; right: -10px; z-index: 2; background: var(--gold); color: #1d1606; font-weight: 800; font-size: 12px;
  padding: 2px 8px; border-radius: 10px; box-shadow: 0 4px 10px #0007; }
.ritem .rname { font-weight: 700; font-size: 13.5px; }
.ritem .rval { color: var(--muted); font-size: 12.5px; font-weight: 600; }

#vault { position: fixed; inset: 0; z-index: 45; background: #050610e0; backdrop-filter: blur(10px); display: grid; place-items: center; padding: 20px; }
#vault[hidden] { display: none; }
.vbox { position: relative; width: min(820px, 100%); display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.vstage { position: relative; height: min(50vh, 430px); width: 100%; display: grid; place-items: center; }
.vstage > .obj { height: 100%; max-width: 92%; cursor: grab; touch-action: none; }
.vstage > .obj.grabbing { cursor: grabbing; }
.vclose { position: absolute; top: 0; right: 0; z-index: 3; width: 38px; height: 38px; border-radius: 50%; border: 0; cursor: pointer;
  background: #ffffff12; color: var(--txt); font-size: 16px; }
.vt { font-weight: 800; font-size: 24px; letter-spacing: -.02em; }
.vs { color: var(--muted); font-weight: 600; font-size: 14px; }
.vs b { color: var(--txt); }
.vbtns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; min-height: 42px; }
.vhint { color: var(--muted); font-size: 12.5px; min-height: 16px; }
/* les boosters qui sortent du produit ouvert */
.vfan { position: absolute; inset: 0; pointer-events: none; }
.vfan .obj { position: absolute; left: 50%; top: 50%; height: var(--h); pointer-events: auto;
  animation: popout .65s cubic-bezier(.2,1.4,.4,1) both; animation-delay: var(--dl); }
@keyframes popout {
  from { transform: translate(-50%, -50%) translateY(40px) scale(.2); opacity: 0; }
  to { transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) rotate(var(--rot)); opacity: 1; }
}

/* ---------- Cards ---------- */
.card {
  --rc: #b8c4d6; --holo: .2;
  position: relative; width: 100%; aspect-ratio: 63 / 88;
  border-radius: 4.5% / 3.2%;
  container-type: inline-size;
  transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
  transition: transform .4s ease, box-shadow .3s;
  will-change: transform;
}
.card.active { transition: transform .05s linear, box-shadow .3s; }
.card .face { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; background: #222; }
.card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.card .shine {
  position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  background:
    repeating-linear-gradient(115deg,
      #ff5c8a 0%, #ffd36b 6%, #7dff9b 12%, #5ed8ff 18%, #b58cff 24%, #ff5c8a 30%);
  background-size: 400% 400%;
  background-position: var(--mx) var(--my);
  mix-blend-mode: color-dodge; opacity: var(--holo);
  filter: brightness(.7) contrast(1.4) saturate(1.2);
  animation: idleholo 6s ease-in-out infinite alternate;
}
.card.active .shine { animation: none; opacity: calc(var(--holo) * 1.1); }
@keyframes idleholo { from { --mx: 20%; --my: 30%; } to { --mx: 80%; --my: 70%; } }
.card .glare {
  position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  background: radial-gradient(circle at var(--mx) var(--my), #ffffff70, #ffffff14 25%, transparent 55%);
  mix-blend-mode: overlay; opacity: 0; transition: opacity .3s;
}
.card.active .glare { opacity: 1; }
.card.matte .shine { display: none; }          /* carte non holo : pas de reflet arc-en-ciel */
.card.matte.active .glare { opacity: .45; }    /* juste un léger éclat sous la souris */

/* placeholder (quand l'image n'est pas encore chargée) */
.ph {
  position: absolute; inset: 0; padding: 5cqw;
  display: flex; flex-direction: column; gap: 3cqw;
  background: linear-gradient(160deg, hsl(var(--h) 70% 62%), hsl(calc(var(--h) + 40) 60% 40%));
  border: 4cqw solid #f3d35b; border-radius: inherit;
}
.ph .top { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; color: #111; }
.ph .nm { font-size: 8.5cqw; line-height: 1.05; }
.ph .art {
  flex: 1; border-radius: 2cqw; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 40%, #ffffff88, #ffffff11 70%), #0002;
  box-shadow: inset 0 0 0 1.2cqw #0003;
  font-weight: 700; letter-spacing: -.02em; font-size: 18cqw; color: #fff8; text-shadow: 0 1cqw 0 #0003;
}
.ph .bot { display: flex; justify-content: space-between; font-weight: 700; font-size: 6cqw; color: #111c; }
.ph .bot .sym { color: #111; }
.face.has-img .ph { display: none; }

/* ---------- Deck (cartes face visible) ---------- */
#deck { position: absolute; width: var(--cw); aspect-ratio: 63/88; }
#deck:empty { pointer-events: none; }   /* vide, il ne doit pas cacher le booster aux clics */
#deck { touch-action: none; }            /* sur mobile, glisser la carte ne fait pas défiler la page */
#deck::before {
  content: ''; position: absolute; inset: 0; border-radius: 4.5% / 3.2%; opacity: 0; transition: opacity .2s;
}
.fcard {
  position: absolute; inset: 0; cursor: pointer;
  transition: transform .55s cubic-bezier(.2,.8,.2,1), opacity .5s;
}
.fcard .card { box-shadow: 0 20px 40px #0009; }
.fcard.enter { transform: translateY(40%) scale(.6) !important; opacity: 0; }
.fcard.out { transform: translate(-115vw, -8vh) rotate(-28deg) !important; opacity: 0; }
/* dévoiler lentement : la carte suit le doigt, puis part vers le haut */
.fcard.peeling { transition: none !important; cursor: grabbing; }
.fcard.peeling .card { box-shadow: 0 34px 60px #000b; }
.fcard.peeling .rlabel { opacity: 0; transition: none; }   /* l'étiquette ne passe pas sur la carte qu'on découvre */
.fcard.out.up { transform: translate(0, -130vh) rotate(-6deg) !important; transition: transform .45s cubic-bezier(.4,0,.6,1), opacity .45s; }
.fcard.shown.hit .card { animation: glow 1.6s ease-in-out infinite alternate; }
@keyframes glow { from { box-shadow: 0 0 20px var(--rc), 0 0 50px var(--rc); } to { box-shadow: 0 0 40px var(--rc), 0 0 120px var(--rc); } }
.fcard.shown.pop .card { animation: cardpop .5s cubic-bezier(.3,1.6,.5,1); }
.fcard.shown.hit.pop .card { animation: cardpop .5s cubic-bezier(.3,1.6,.5,1), glow 1.6s ease-in-out .5s infinite alternate; }
@keyframes cardpop { from { scale: .92; } 50% { scale: 1.06; } to { scale: 1; } }

.tag {
  position: absolute; z-index: 3; top: -12px; right: -12px;
  font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 999px;
  background: var(--gold); color: #1d1606; box-shadow: 0 4px 14px #0008;
  transform: rotate(6deg);
}
.rlabel {
  position: absolute; left: 50%; bottom: -50px; transform: translateX(-50%); white-space: nowrap; text-align: center;
  font-weight: 700; font-size: 15px; color: var(--rc); text-shadow: 0 0 12px var(--rc);
  opacity: 0; transition: opacity .3s .15s; line-height: 1.25;
}
.rlabel .pr { color: var(--green); text-shadow: 0 0 10px #4ce08a88; font-size: 14px; }
.fcard.shown .rlabel { opacity: 1; }
.fcard:not(.shown) .tag { display: none; }

/* ---------- Summary ---------- */
#summary { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; overflow-y: auto; padding: 10px 0; }
#summary[hidden] { display: none; }
.sumrow { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; max-width: 1150px; }
.sumrow .slot { width: clamp(90px, 11vw, 150px); position: relative; animation: pop .5s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes pop { from { transform: translateY(30px) scale(.7); opacity: 0; } }
.sumtitle { font-weight: 700; letter-spacing: -.02em; font-size: 26px; text-align: center; }
.sumval { font-weight: 700; color: var(--muted); text-align: center; }
.sumval b { color: var(--txt); }
.sumval .up { color: var(--green); } .sumval .down { color: var(--red); }

/* étiquette de prix sur une carte */
.price {
  position: absolute; left: 6px; bottom: 6px; z-index: 3; background: #0b0d17d0; color: #fff; font-weight: 600; font-size: 11px;
  padding: 2px 7px; border-radius: 6px; pointer-events: none; font-variant-numeric: tabular-nums;
}
.price.big { color: #ffe3a3; }

/* ---------- Carte gradée : boîtier en plastique épais façon PSA ---------- */
/* .slab = conteneur (les tailles en cqw se calculent sur sa largeur), .case = le boîtier dessiné */
.slab {
  --rx: 0deg; --ry: 0deg; position: relative; container-type: inline-size;
  transform: perspective(900px) rotateX(var(--rx)) rotateY(var(--ry)); transition: transform .4s ease;
}
.slab .case {
  position: relative; padding: 3.5cqw 5cqw 5.5cqw; border-radius: 4.5cqw;
  background: linear-gradient(135deg, #eef4fb70, #b7c5d84a 38%, #dfe8f266 70%, #f4f8fc7a);
  border: 1px solid #ffffffc0;
  box-shadow: inset 0 0 0 1.4cqw #ffffff1f, inset 0 1px 0 #fff, inset 0 -3px 6px #00000040, 0 12px 30px #000a;
}
.slab.active { transition: transform .05s linear; }
/* les petites rainures en haut du boîtier */
.slab .ridge { height: 2cqw; margin: 0 8cqw 2.6cqw; border-radius: 1cqw; opacity: .7;
  background: repeating-linear-gradient(90deg, #ffffffb0 0 1px, #ffffff00 1px 3px); box-shadow: inset 0 1px 2px #0003; }
.slab .lbl {
  position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 2cqw;   /* minmax : un nom long passe en « … » au lieu de pousser la note */ align-items: center;
  background: linear-gradient(#fff, #f1f1f1); border: .9cqw solid #c8102e; border-radius: 1.6cqw; padding: 2.2cqw 3cqw 2cqw;
  color: #111; font-family: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif; box-shadow: 0 1px 3px #0005;
}
.slab .lbl .t { font-size: 4.1cqw; font-weight: 700; text-transform: uppercase; line-height: 1.28; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slab .lbl .nm { font-size: 5.3cqw; font-weight: 900; }
.slab .lbl .gr { text-align: right; text-transform: uppercase; padding-right: 1.2cqw; }
.slab .lbl .gn { display: block; font-size: 4.1cqw; font-weight: 800; }
.slab .lbl .gd { display: block; letter-spacing: -.04em; font-size: 12cqw; font-weight: 900; line-height: .95; font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif; }
.slab .lbl .foot { grid-column: 1 / -1; display: flex; align-items: center; gap: 2cqw; margin-top: 1.4cqw; }
.slab .lbl .holo {
  width: 10cqw; height: 5cqw; border-radius: .8cqw; display: grid; place-items: center;
  font: 900 2.6cqw 'Arial Black', Arial, sans-serif; color: #fffc; letter-spacing: .02em;
  background: linear-gradient(120deg, #ff9ad5, #9ae6ff, #c8ffa8, #ffe38a, #ff9ad5); background-size: 300% 100%;
  animation: holo 5s linear infinite; box-shadow: inset 0 0 0 1px #fff8;
}
@keyframes holo { to { background-position: 300% 0; } }
.slab .lbl .bar { flex: 1; height: 4cqw; opacity: .85;
  background: repeating-linear-gradient(90deg, #111 0 1px, #0000 1px 2px, #111 2px 4px, #0000 4px 5px, #111 5px 6px, #0000 6px 8px, #111 8px 9px, #0000 9px 11px); }
.slab .lbl .cert { font-size: 3.5cqw; font-weight: 700; color: #555; }
/* le logement de la carte : creusé dans le plastique */
.slab .well { margin-top: 3.6cqw; padding: 2.4cqw; border-radius: 2.6cqw; background: #0a0f1e2e;
  box-shadow: inset 0 2px 7px #0008, inset 0 0 0 1px #ffffff5c, 0 1px 0 #ffffff80; }
.slab .card { box-shadow: 0 2px 6px #0007; }
/* reflets du plastique, par-dessus tout */
.slab .gloss { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 2; overflow: hidden;
  background: linear-gradient(115deg, #ffffff5e 0%, #ffffff14 20%, #fff0 38%, #fff0 60%, #ffffff1f 76%, #fff0 90%); }
.slab.active .gloss { background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), #ffffff40, #fff0 45%),
  linear-gradient(115deg, #ffffff5e 0%, #ffffff14 20%, #fff0 38%, #fff0 60%, #ffffff1f 76%, #fff0 90%); }
.slab .gloss::after { content: ""; position: absolute; inset: -10% auto -10% 0; width: 35%; transform: translateX(-150%) skewX(-18deg);
  background: linear-gradient(90deg, #fff0, #ffffffb0, #fff0); }
.slab.g10 .case { box-shadow: inset 0 0 0 1.4cqw #ffffff1f, inset 0 1px 0 #fff, inset 0 -3px 6px #00000040, 0 0 24px #ffd76a99, 0 12px 30px #000a; }
.slab .price { left: 8cqw; bottom: 8cqw; z-index: 3; }
.mcard.slabbed { width: min(340px, 80vw, calc((100vh - 270px) * .62)); }
/* mise en boîtier : le boîtier arrive, la carte glisse dedans, reflet, puis l'étiquette s'imprime et la note apparaît */
.slab.reveal { animation: caseIn .45s ease-out both; }
.slab.reveal .card { animation: insert .85s .35s cubic-bezier(.2, .9, .3, 1) both; }
.slab.reveal .gloss::after { animation: sweep .9s 1.15s ease-in-out both; }
.slab.reveal .lbl { animation: print .8s 1.5s ease-out both; }
.slab.reveal .gr { animation: gradeIn .55s 2.35s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes caseIn { from { opacity: 0; transform: perspective(900px) translateY(16px) scale(.94); } }
@keyframes insert { from { opacity: 0; transform: translateY(-115%) scale(1.04); } 55% { opacity: 1; } 88% { transform: translateY(1.5%); } }
@keyframes sweep { to { transform: translateX(420%) skewX(-18deg); } }
@keyframes print { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes gradeIn { from { opacity: 0; transform: scale(2.2); } }
.catbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 4px 0 12px; }
.catbar .grow { flex: 1; }
.slot .mine { position: absolute; top: 6px; right: 6px; z-index: 3; background: var(--green); color: #032611; font-weight: 700; font-size: 11px; padding: 1px 6px; border-radius: 8px; }
.slot .odds { text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 4px; }
.graded-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

/* ---------- FX ---------- */
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
#flash { position: fixed; inset: 0; pointer-events: none; z-index: 49; background: var(--fc, #fff); opacity: 0; }
#flash.go { animation: flash .9s ease-out; }
@keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }
#banner {
  position: fixed; left: 50%; top: 18%; z-index: 51; pointer-events: none;
  font-weight: 700; letter-spacing: -.02em; font-size: clamp(26px, 5vw, 56px); text-align: center; line-height: 1.05;
  color: #fff; text-shadow: 0 0 28px var(--bc), 0 2px 12px #000a;
  transform: translate(-50%, 0) scale(0); opacity: 0; width: 92vw;
}
#banner small { display: block; font-size: .42em; font-weight: 600; letter-spacing: 0; color: var(--green); text-shadow: 0 2px 12px #000a; margin-top: 8px; }
#banner.go { animation: banner 2.4s cubic-bezier(.2,1.4,.4,1) forwards; }
@keyframes banner {
  0% { transform: translate(-50%, 0) scale(0) rotate(-8deg); opacity: 0; }
  15% { transform: translate(-50%, 0) scale(1.1) rotate(2deg); opacity: 1; }
  25% { transform: translate(-50%, 0) scale(1) rotate(0); }
  80% { opacity: 1; }
  100% { transform: translate(-50%, -30px) scale(1); opacity: 0; }
}
#toast {
  position: fixed; left: 50%; bottom: 24px; z-index: 60; transform: translate(-50%, 140%); transition: transform .35s cubic-bezier(.3,1.4,.5,1);
  background: #191c2bf2; border-radius: 12px; padding: 11px 18px; font-weight: 600; font-size: 14px; box-shadow: 0 10px 40px #000a, inset 0 0 0 1px #ffffff18;
  max-width: calc(100vw - 32px); text-align: center; opacity: 0;
}
#toast.on { transform: translate(-50%, 0); opacity: 1; }

/* ---------- Chips / sélecteur de série ---------- */
.filters, .setchips { display: flex; gap: 6px; flex-wrap: wrap; }
.setchips { justify-content: center; margin: 4px auto 26px; max-width: 1300px; }
.chip { border: 0; padding: 6px 13px; border-radius: 999px; background: transparent; color: var(--muted); font-weight: 600; font-size: 13px;
  box-shadow: inset 0 0 0 1px var(--line); transition: .15s; }
.chip:hover { color: var(--txt); }
.chip.on { background: #ffffff14; color: var(--txt); box-shadow: inset 0 0 0 1px #ffffff2a; }
.chip small { opacity: .7; margin-left: 4px; }

/* ---------- Boutique ---------- */
.shop { max-width: 1200px; margin: 0 auto; }
.sethero { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: space-between; margin-bottom: 14px; }
.sethero h2 { font-weight: 800; letter-spacing: -.03em; font-size: 30px; margin: 0; color: var(--txt); display: flex; align-items: center; gap: 12px; }
.sethero h2::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--sc); box-shadow: 0 0 14px var(--sc); }
.sethero p { margin: 6px 0 0; color: var(--muted); font-weight: 500; font-size: 15px; max-width: 640px; }
.products { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.prod {
  background: var(--surface); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 8px;
  box-shadow: inset 0 0 0 1px var(--line); transition: background .2s;
}
.prod:hover { background: #ffffff0b; }
.prod .pimg { height: 210px; display: grid; place-items: center; }
.prod .pimg img { max-height: 210px; max-width: 100%; object-fit: contain; filter: drop-shadow(0 16px 20px #000a); transition: transform .3s; }
.prod:hover .pimg img { transform: translateY(-6px) rotate(-2deg) scale(1.03); }
.prod .pname { font-weight: 700; }
.prod .psub { color: var(--muted); font-weight: 500; font-size: 13px; }
.prod .pprice { font-weight: 700; letter-spacing: -.02em; font-size: 21px; color: var(--txt); margin-top: 4px; font-variant-numeric: tabular-nums; }
.prod .pprice small { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: 0; display: block; }
.prod .row { display: flex; gap: 8px; flex-wrap: wrap; }
.prod .owned { font-size: 13px; color: var(--gold); font-weight: 700; min-height: 1.2em; }
.shop h3 { font-weight: 600; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 44px 0 14px; }
.inv { display: grid; gap: 10px; }
.invrow { display: flex; align-items: center; gap: 14px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); border-radius: 14px; padding: 10px 14px; flex-wrap: wrap; }
.invrow img { height: 64px; filter: drop-shadow(0 6px 8px #0009); }
.invrow .grow { flex: 1; min-width: 160px; }
.invrow .t { font-weight: 700; }
.invrow .s { color: var(--muted); font-weight: 600; font-size: 13px; }
.note { color: var(--muted); font-size: 13px; font-weight: 500; line-height: 1.6; padding: 4px 2px 0; }
details.info { margin-top: 14px; }
details.info summary { cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 600; list-style: none; display: inline-flex; align-items: center; gap: 6px; padding: 4px 0; }
details.info summary::-webkit-details-marker { display: none; }
details.info summary::before { content: "›"; display: inline-block; transition: transform .2s; font-size: 16px; line-height: 1; }
details.info[open] summary::before { transform: rotate(90deg); }
details.info summary:hover { color: var(--txt); }
details.info > :not(summary) { margin-top: 10px; }
.note a { color: var(--muted); }

/* ---------- Classeur ---------- */
/* vue « vrai classeur » : deux pages de 9 pochettes, anneaux au milieu, pages qui tournent en 3D */
.book-wrap { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 6px auto 0; user-select: none; -webkit-user-select: none; }
.book {
  --pw: min(42vw, calc((100vh - 390px) * .75), 470px);
  position: relative; display: grid; grid-template-columns: var(--pw) 38px var(--pw); padding: 18px 16px;
  border-radius: 20px; perspective: 2600px; touch-action: pan-y;
  background: radial-gradient(120% 90% at 50% 0%, #3a2a55 0%, #1d1430 60%, #150f22 100%);
  box-shadow: 0 40px 90px #000c, inset 0 0 0 2px #ffffff12, inset 0 2px 0 #ffffff1c;
}
.book.single { --pw: min(calc(100vw - 64px), calc((100vh - 330px) * .75)); grid-template-columns: var(--pw); padding: 14px; }
.book.single .bk-left, .book.single .rings { display: none; }
.page-slot { position: relative; width: var(--pw); aspect-ratio: .75; }
.bpage {
  position: absolute; inset: 0; border-radius: 10px; overflow: hidden;
  background: linear-gradient(180deg, #1b1826, #121019); box-shadow: inset 0 0 0 1px #ffffff10, inset 0 0 40px #0006;
}
.bk-left .bpage { border-radius: 10px 4px 4px 10px; } .bk-right .bpage { border-radius: 4px 10px 10px 4px; }
.pockets { position: absolute; inset: 0; padding: calc(var(--pw) * .04); display: grid; gap: calc(var(--pw) * .04);
  grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
.pocket { position: relative; border-radius: 5px; background: #ffffff07; box-shadow: inset 0 0 0 1px #ffffff17; cursor: pointer; }
.pocket.empty { cursor: default; }
.pocket::after {   /* reflet de la pochette plastique */
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 2;
  background: linear-gradient(118deg, #ffffff1f 0%, #ffffff05 28%, transparent 45%, transparent 70%, #ffffff0d 100%);
  box-shadow: inset 0 3px 0 -1px #ffffff26;
}
.pocket .card { width: 100%; transition: transform .25s; }
.pocket:hover .card { transform: translateY(-3px) scale(1.03); }
.pocket .count, .pocket .gbadge { position: absolute; z-index: 3; font-weight: 700; font-size: 11px; padding: 1px 6px; border-radius: 7px; }
.pocket .count { bottom: 4px; right: 4px; background: #000c; color: #fff; }
.pocket .gbadge { top: 4px; left: 4px; background: var(--gold); color: #1d1606; }
.pocket .miss { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 4px; padding: 6px; color: #ffffff38; font-size: 11px; line-height: 1.2; }
.pocket .miss b { font-size: 16px; color: #ffffff2e; }
.bcover { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 12px; padding: 10%;
  background: radial-gradient(90% 70% at 50% 30%, #ffffff12, transparent 70%); }
.bcover .t { font-size: calc(var(--pw) * .08); font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
.bcover .s { color: var(--muted); font-size: 13px; }
.bcover .big { font-size: calc(var(--pw) * .13); font-weight: 800; color: var(--gold); line-height: 1; }
.bcover .bar { width: 70%; }
.bcover .go { margin-top: 10px; color: var(--muted); font-size: 12px; animation: nudge 1.8s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(6px); } }
.bpage .pno { position: absolute; bottom: 5px; left: 0; right: 0; text-align: center; font-size: 10px; color: #ffffff30; z-index: 3; pointer-events: none; }
.bpage.blank { background: linear-gradient(180deg, #17141f, #0f0d15); }
.rings { display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; position: relative; z-index: 6; pointer-events: none; }
.rings::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 10px; transform: translateX(-50%); background: linear-gradient(90deg, #0008, #0002, #0008); border-radius: 4px; }
.rings i { position: relative; width: 46px; height: 18px; border-radius: 12px; border: 4px solid transparent;
  background: linear-gradient(#0000, #0000) padding-box, linear-gradient(180deg, #f3f3f7, #8d8fa0 45%, #e9e9ef 60%, #6f7182) border-box; box-shadow: 0 3px 6px #0009; }
/* la page qui tourne */
.leaf { position: absolute; top: 0; width: var(--pw); aspect-ratio: .75; transform-style: preserve-3d; z-index: 8; will-change: transform; }
.leaf .lf { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.leaf .lb { transform: rotateY(180deg); }
.leaf .lf::after { content: ""; position: absolute; inset: 0; border-radius: 10px; pointer-events: none; z-index: 9;
  background: linear-gradient(90deg, #000 0%, transparent 60%); opacity: var(--shade, 0); }
.leaf.anim { transition: transform .7s cubic-bezier(.45,.05,.3,1); }
/* classeur fermé : couverture simili-cuir, fenêtre avec l'illustration de la carte phare, logo officiel de la série */
.book { transition: transform .7s cubic-bezier(.45,.05,.3,1), background .5s, box-shadow .5s; }
.book.closed { transform: translateX(calc((var(--pw) + 38px) / -2)); background: transparent; box-shadow: none; }
.book.closed .bk-left, .book.closed .rings { visibility: hidden; }
.book.single.closed { transform: none; }
.bfront {
  position: absolute; inset: 0; border-radius: 6px 16px 16px 6px; overflow: hidden; cursor: pointer;
  background:
    radial-gradient(120% 80% at 30% 10%, #ffffff1a, transparent 60%),
    repeating-radial-gradient(circle at 20% 30%, #ffffff05 0 1px, transparent 1px 3px),
    linear-gradient(160deg, color-mix(in srgb, var(--sc) 55%, #1a1024), color-mix(in srgb, var(--sc) 22%, #0c0812));
  box-shadow: 0 40px 90px #000c, inset 0 0 0 1px #ffffff1c, inset 14px 0 18px -8px #0009;
}
.bfront::before {   /* coutures */
  content: ""; position: absolute; inset: 3.2%; border-radius: 12px; border: 2px dashed #ffffff30; pointer-events: none;
}
.bfront .spine { position: absolute; left: 0; top: 0; bottom: 0; width: 7%; background: linear-gradient(90deg, #0008, #0002 70%, #ffffff10); }
.bfront .strap { position: absolute; right: 6%; top: 0; bottom: 0; width: 4.5%; background: linear-gradient(90deg, #00000080, #1c1424 30%, #2a2033 60%, #00000080); box-shadow: 0 0 10px #0008; }
.bfront .art {
  position: absolute; left: 14%; right: 17%; top: 20%; bottom: 20%; border-radius: 12px;
  background-size: 150%; background-position: 50% 24%;   /* zoom sur l'illustration de la carte */
  box-shadow: 0 0 0 4px #00000055, 0 0 0 5px #ffffff25, 0 18px 40px #000a, inset 0 0 30px #0007;
  transition: transform .5s;
}
.bfront .art::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: linear-gradient(125deg, #ffffff40 0%, #ffffff00 30%, #ffffff00 65%, #ffffff18 100%); }
.bfront:hover .art { transform: scale(1.02); }
.bfront .logo { position: absolute; left: 10%; right: 13%; top: 4.5%; height: 19%; object-fit: contain; filter: drop-shadow(0 6px 12px #000c); }
.bfront .foot { position: absolute; left: 10%; right: 13%; bottom: 6.5%; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #ffffffcc; font-weight: 600; }
.bfront .foot b { color: var(--gold); font-size: 16px; }
.bfront .foot span:last-child { animation: nudge 1.8s ease-in-out infinite; }
.bk-nav { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: #ffffff0a; color: var(--txt); font-size: 24px; cursor: pointer; flex: none; transition: background .2s, transform .2s; }
.bk-nav:hover:not(:disabled) { background: #ffffff1c; transform: scale(1.08); }
.bk-nav:disabled { opacity: .25; cursor: default; }
.bk-foot { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 16px auto 30px; color: var(--muted); font-size: 13px; }
.bk-foot input { width: min(360px, 60vw); accent-color: var(--gold); }
@media (max-width: 760px) { .book-wrap .bk-nav { display: none; } }

.binder-head { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; max-width: 1300px; margin: 0 auto 18px; }
.prog { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-end; }
.prog div { font-weight: 600; color: var(--muted); }
.prog b { color: var(--txt); }
.bar { height: 6px; width: 160px; border-radius: 9px; background: #ffffff10; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold2), var(--gold)); border-radius: 9px; }
.bactions { display: flex; gap: 8px; flex-wrap: wrap; max-width: 1300px; margin: 0 auto 18px; }
.reward { color: var(--muted); font-size: 12px; font-weight: 500; }
/* mode vente : sélection de cartes */
.selling .slot { cursor: copy; }
.slot.picked { outline: 3px solid var(--green); outline-offset: 3px; border-radius: 6px; }
.slot .pick {
  position: absolute; top: 6px; left: 6px; z-index: 3; background: var(--green); color: #032611; font-weight: 700; font-size: 12px;
  padding: 2px 7px; border-radius: 8px;
}
.sellbar {
  position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 30; width: min(760px, calc(100% - 24px));
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center;
  background: #151826ee; backdrop-filter: blur(14px); border: 1px solid #5ad19a40; border-radius: 16px; padding: 10px 12px;
  box-shadow: 0 12px 40px #000a;
}
.sellbar .sum { font-weight: 700; margin-right: auto; }
.sellbar .sum b { color: var(--green); }
.selling #binder { padding-bottom: 110px; }
.bsec { max-width: 1300px; margin: 0 auto 30px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; }

}

#modal[hidden] { display: none; }
.mwrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.mcard { width: min(360px, 80vw, calc((100vh - 220px) * 63 / 88)); }
.minfo { text-align: center; font-weight: 600; line-height: 1.5; }
.minfo .r { color: var(--rc); }
.minfo .cote { font-weight: 700; letter-spacing: -.02em; color: var(--green); font-size: 22px; }

/* ---------- Stats ---------- */
.stats { max-width: 960px; margin: 10px auto; display: grid; gap: 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.tile { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); border-radius: 16px; padding: 16px 18px; }
.tile .v { font-weight: 700; letter-spacing: -.02em; font-size: 22px; font-variant-numeric: tabular-nums; }
.tile .v.up { color: var(--green); } .tile .v.down { color: var(--red); }
.tile .l { color: var(--muted); font-weight: 500; font-size: 12px; margin-top: 2px; }
.rtable { width: 100%; border-collapse: collapse; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); border-radius: 14px; overflow: hidden; font-size: 14px; font-weight: 500; }

.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; background: var(--rc); box-shadow: 0 0 8px var(--rc); }

@media (max-width: 640px) {

  #stage { height: calc(100vh - 250px); height: calc(100svh - 250px); min-height: 360px; }

<script>
/* =====================================================================

/* =====================================================================
   SÉRIES : contenu d'un booster + taux de drop RÉELS relevés par la communauté
   (probabilité par booster). Slot "HIT" : une seule chance par booster,
   sinon on reçoit la carte "fallback".
   Sources : TCGplayer (151 : 95 % IC ; Évolution Céleste : 8 000 boosters ; 30e Anniversaire),
   Évolutions Prismatiques (taux publiés au lancement), WOTC 1999 (holo ≈ 1 booster sur 3),
   Primo-Choc et Explosion Plasma (ThePriceDex, données communautaires),
   Mew RGB : ~1 booster sur 3 200 pour l'un des trois (estimation communautaire, aucun chiffre officiel),
   Foudre Noire (TCGplayer ; Rare Noir & Blanc : ~2 sur 1 000 boosters, comptage Reddit),
   HeartGold SoulSilver (Card Codex : holo 1 carte sur 59 boosters × 14, Prime 1/6, LÉGENDE 1/12),
   Rivalités Destinées (TCGplayer, ~8 000 boosters ouverts).
   ===================================================================== */
const SETS = [
  { id: "30th", unlock: 0, name: "30e Anniversaire", year: 2026, color: "#ffd76a", booster: "696613",
    desc: "Le set anniversaire : 30 Pikachu à collectionner, la Collection Classique, les Futuristes et le mythique Mew RGB.",
    order: ["E", "C", "C", "C/R", "HIT", "PR"],
    hit: [["DR", 1/4.4], ["IR", .1972], ["CC", 1/10.5], ["SIR", .0488], ["FR", 1/100], ["RGB", 1/3200]], fallback: "R" },
  { id: "151", unlock: 0, name: "Écarlate et Violet — 151", year: 2023, color: "#ff5c7a", booster: "504467",
    desc: "Les 151 Pokémon de Kanto. La chasse : Dracaufeu-ex Illustration Spéciale Rare.",
    order: ["C", "C", "C", "C", "U", "U", "U", "REV", "REV", "HIT"],
    hit: [["DR", .1328], ["IR", .0850], ["UR", .0644], ["SIR", .0311], ["GR", .0194]], fallback: "R" },
  { id: "pre", unlock: 0, name: "Évolutions Prismatiques", year: 2025, color: "#c77dff", booster: "593294",
    desc: "Le set Évoli le plus chassé de l'ère Écarlate et Violet. 32 SIR, dont Noctali-ex.",
    order: ["C", "C", "C", "C", "U", "U", "U", "REV", "REV", "HIT"],
    hit: [["DR", 1/6], ["UR", 1/13], ["ACE", 1/21], ["SIR", 1/45], ["GR", 1/180]], fallback: "R" },
  { id: "dr", unlock: 0, name: "Rivalités Destinées", year: 2025, color: "#e0343c", booster: "624683",
    desc: "La Team Rocket est de retour : les Pokémon de Giovanni, Ariane et Lance. La chasse : Mewtwo-ex de la Team Rocket Illustration Spéciale Rare.",
    order: ["C", "C", "C", "C", "U", "U", "U", "REV", "REV", "HIT"],
    hit: [["DR", 1/5], ["IR", 1/12], ["UR", 1/16], ["SIR", 1/94], ["GR", 1/149]], fallback: "R" },
  { id: "evs", unlock: 100, name: "Évolution Céleste", year: 2021, color: "#5ec8ff", booster: "244337",
    desc: "Le meilleur set moderne selon les collectionneurs : les Alternatives, et le mythique « Moonbreon » (Noctali VMAX 215).",
    order: ["C", "C", "C", "C", "C", "U", "U", "U", "REV", "HIT"],
    hit: [["H", .22], ["V", .1056], ["VMAX", .0560], ["UR", .0278], ["AA", .0110], ["GR", .0091], ["SR", .0084], ["AAS", .0030]], fallback: "R" },
  { id: "primo", unlock: 250, name: "Primo-Choc", year: 2015, color: "#ff6a3d", booster: "97751",
    desc: "XY, Hoenn à l'honneur : Primo-Kyogre et Primo-Groudon. Les EX Full Art sont la vraie chasse.",
    order: ["C", "C", "C", "C", "C", "U", "U", "U", "REV", "HIT"],
    hit: [["H", 1/6.4], ["EX", 1/9], ["UR", 1/17], ["GR", 1/125]], fallback: "R" },
  { id: "plasma", unlock: 500, name: "Explosion Plasma", year: 2013, color: "#4f8bff", booster: "98573",
    desc: "Noir et Blanc, la Team Plasma. Le Graal : Palkia-EX et Dialga-EX Full Art.",
    order: ["C", "C", "C", "C", "C", "U", "U", "U", "REV", "HIT"],
    hit: [["H", 1/4.2], ["EX", 1/18], ["ACE", 1/24], ["UR", 1/35.5], ["GR", 1/112.5]], fallback: "R" },
  { id: "blk", unlock: 500, name: "Foudre Noire", year: 2025, color: "#9b7bff", booster: "630434",
    desc: "Retour à Unys avec Zekrom-ex. 69 Illustration Rares, et le Graal : les Rares Noir & Blanc (Zekrom-ex, Victini).",
    order: ["C", "C", "C", "C", "U", "U", "U", "REV", "REV", "HIT"],
    hit: [["DR", 1/5], ["IR", 1/6], ["UR", 1/17], ["SIR", 1/80], ["BWR", 1/500]], fallback: "R" },
  { id: "hgss", unlock: 500, name: "HeartGold SoulSilver", year: 2010, color: "#e8c547", booster: "98530",
    desc: "Johto, les remakes d'Or et Argent : les Pokémon Prime et les LÉGENDE Ho-Oh et Lugia (une carte en deux moitiés).",
    order: ["C", "C", "C", "C", "C", "U", "U", "U", "REV", "HIT"],
    hit: [["H", 1/4.2], ["PRIME", 1/6], ["LEG", 1/12]], fallback: "R" },
  { id: "fossile", unlock: 1000, name: "Fossile", year: 1999, color: "#d9b26a", booster: "138134",
    desc: "Troisième extension de l'histoire (édition illimitée). Ectoplasma, Dracolosse, Lokhlass holo.",
    order: ["C", "C", "C", "C", "C", "C", "C", "U", "U", "U", "HIT"],
    hit: [["H", 1/3]], fallback: "R" },
  { id: "base", unlock: 1500, name: "Set de Base", year: 1999, color: "#ffcb05", booster: "138130",
    desc: "Là où tout a commencé (édition illimitée). Le Graal : Dracaufeu holo 4/102.",
    order: ["E", "C", "C", "C", "C", "C", "C", "U", "U", "U", "HIT"],
    hit: [["H", 1/3]], fallback: "R" },
];
const SET = Object.fromEntries(SETS.map(s => [s.id, s]));
/* une série se débloque quand on a ouvert assez de boosters, toutes séries confondues (seuil "unlock") */

/* ---------- Cartes & produits (data.js) ---------- */
const CARDS = CARD_DATA.map(([id, set, order, num, name, rarity, price, img, tcg]) =>
  ({ id, set, order, num, name, rarity, price: Math.round(price * 100), img, tcg }));
const BY_ID = Object.fromEntries(CARDS.map(c => [c.id, c]));
const POOL = {};   // POOL[série][rareté] = [cartes]
CARDS.forEach(c => ((POOL[c.set] ||= {})[c.rarity] ||= []).push(c));

const KIND = { booster: "Booster", bundle: "Bundle", etb: "Coffret Dresseur d'Élite", display: "Display" };
const PRODUCTS = PRODUCT_DATA.map(([set, id, kind, packs, price]) =>
  ({ set, id: String(id), kind, packs, price: Math.round(price * 100), img: `produits/${id}.webp`,
     name: KIND[kind], sub: packs > 1 ? packs + " boosters" : SET[set].order.length + " cartes" }));
const PROD = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));
const boosterOf = setId => PRODUCTS.find(p => p.set === setId && p.kind === "booster");
/* un booster en vrac vaut le prix par booster le plus bas de la série :
   sinon acheter un bundle et revendre ses boosters à l'unité ferait de l'argent à l'infini */
const looseValue = setId => Math.min(...PRODUCTS.filter(p => p.set === setId).map(p => Math.floor(p.price / p.packs)));

const START_MONEY = 1000000_00;  // argent de départ (en centimes)
/* boosters gratuits : 10 d'un coup ; quand ils sont tous ouverts, les 10 suivants arrivent 30 min plus tard */
const FREE_COUNT = 10, FREE_EVERY = 30 * 60 * 1000;
const FAST_FEE = 200_00;         // frais de l'ouverture ×10 : ça pousse à ouvrir à la main
const DAILY_GIFT = 2000_00;      // cadeau du jour (une fois par jour)
const FREE_CASH = 250_00;        // argent offert à chaque recharge des boosters gratuits (toutes les 30 min)
/* récompenses de collection, une seule fois par série et par palier */
const REWARDS = [[25, 250_00], [50, 750_00], [100, 2500_00]];
const PIKA_REWARD = 1000_00;     // les 30 Pikachu du 30e Anniversaire
/* GRADING : 100 $ par carte, note tirée au hasard entre 5 et 10.
   [note, nom, probabilité, multiplicateur de cote] : un 10 triple la cote, un 9 la multiplie par 1,5,
   un 8 ou un 7 ne change rien, un 6 ou un 5 la baisse un peu. Moyenne : ×1,21, donc grader une
   petite carte fait perdre de l'argent ; ça ne vaut le coup que sur les grosses cartes. */
const GRADE_COST = 100_00;
const GRADES = [[10, "GEM MT", .08, 3], [9, "MINT", .20, 1.5], [8, "NM-MT", .30, 1], [7, "NM", .22, 1], [6, "EX-MT", .13, .8], [5, "EX", .07, .65]];
const GRADE = Object.fromEntries(GRADES.map(g => [g[0], g]));
const GRADER = "RKG";            // « Repokémon Grading », notre PSA maison
const SELL_RATE = 1;             // revente = 100 % de la cote, sans frais

/* =====================================================================
   SAUVEGARDE (les montants sont en centimes de dollar)
   ===================================================================== */
const SAVE_KEY = "booster-sim-v3";   // v2.1 : nouvelle partie pour tout le monde (progression par déblocage)
const fresh = () => ({ money: START_MONEY, owned: {}, packs: {}, pulled: {}, hits: [], boosters: {}, sealed: {},
  spent: 0, earned: 0, bonus: 0, rewards: {}, gift: "", graded: [], prices: {}, priceDate: {}, sel: "free",
  free: FREE_COUNT, freeAt: 0, freeSet: "30th", unlocked: [], startMoney: START_MONEY });
let save = fresh();
/* index.html#nouvelle-partie : repart de zéro */
if (location.hash === "#nouvelle-partie") {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  history.replaceState(null, "", location.pathname);
}
try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (s) save = Object.assign(save, { startMoney: null }, s);
} catch (e) {}
/* quand l'argent de départ augmente, les parties en cours reçoivent une fois la différence
   (startMoney = le départ déjà reçu ; les parties d'avant ce champ ont démarré à 10 000 $, ou 50 000 $ si start50k) */
let topUp = 0;
if (save.startMoney !== START_MONEY) {
  const had = save.startMoney ?? (save.start50k ? 50000_00 : 10000_00);
  topUp = Math.max(0, START_MONEY - had); save.money += topUp; save.startMoney = START_MONEY;
}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ---------- Argent ---------- */
const fmt = c => {
  const v = c / 100;
  return v.toLocaleString("fr-FR", { minimumFractionDigits: v >= 1000 || Number.isInteger(v) ? 0 : 2, maximumFractionDigits: v >= 1000 ? 0 : 2 }) + " $";
};
const priceOf = card => save.prices[card.id] ?? card.price;
const sellPrice = c => Math.max(1, Math.round(c * SELL_RATE));
/* cartes gradées : save.graded = [{ u: identifiant unique, id: carte, g: note }] */
const gradedOf = id => save.graded.filter(x => x.id === id).sort((a, b) => b.g - a.g);
const has = id => !!save.owned[id] || save.graded.some(x => x.id === id);
const gradedPrice = x => Math.round(priceOf(BY_ID[x.id]) * GRADE[x.g][3]);
const ownedValue = () => Object.entries(save.owned).reduce((a, [id, n]) => a + (BY_ID[id] ? priceOf(BY_ID[id]) * n : 0), 0) +
  save.graded.reduce((a, x) => a + (BY_ID[x.id] ? gradedPrice(x) : 0), 0);
const sealedValue = () =>
  Object.entries(save.sealed).reduce((a, [id, n]) => a + (PROD[id] ? PROD[id].price * n : 0), 0) +
  Object.entries(save.boosters).reduce((a, [s, n]) => a + looseValue(s) * n, 0);
const opened = () => Object.values(save.packs).reduce((a, b) => a + b, 0);
const isUnlocked = id => opened() >= SET[id].unlock;
const nextLock = () => SETS.filter(s => !isUnlocked(s.id)).sort((a, b) => a.unlock - b.unlock)[0];
function pay(c) {
  if (save.money < c) return false;
  save.money -= c; save.spent += c; return true;
}
function gain(c) { save.money += c; save.earned += c; }
function bonus(c) { save.money += c; save.bonus += c; }

/* =====================================================================
   TIRAGE
   ===================================================================== */
const rnd = arr => arr[Math.floor(Math.random() * arr.length)];
function rollHit(set) {
  let x = Math.random();
  for (const [r, p] of set.hit) { if (x < p) return r; x -= p; }
  return set.fallback;
}
function makePack(setId) {
  const set = SET[setId], pool = POOL[setId];
  const used = new Set();   // jamais deux fois la même carte dans un booster
  const pick = r => {
    const list = pool[r].filter(c => !used.has(c.id));
    const c = rnd(list.length ? list : pool[r]); used.add(c.id); return c;
  };
  return set.order.map(slot => {
    if (slot === "C/R") return pick(Math.random() < 1/3 ? "R" : "C");
    if (slot === "REV") { const x = Math.random(); return pick(x < .15 ? "R" : x < .5 ? "U" : "C"); }
    if (slot === "HIT") return pick(rollHit(set));
    return pick(slot);

}
/* nombre moyen de cartes de chaque rareté dans un booster (mêmes règles que makePack) */
function perPack(setId) {
  const set = SET[setId], e = {}, add = (r, k) => e[r] = (e[r] || 0) + k;
  for (const slot of set.order) {
    if (slot === "C/R") { add("R", 1/3); add("C", 2/3); }
    else if (slot === "REV") { add("R", .15); add("U", .35); add("C", .5); }
    else if (slot === "HIT") { let rest = 1; for (const [r, p] of set.hit) { add(r, p); rest -= p; } add(set.fallback, rest); }
    else add(slot, 1);

}
const PER_PACK = Object.fromEntries(SETS.map(s => [s.id, perPack(s.id)]));
const oddsText = k => k >= .5 ? `≈ ${String(+k.toFixed(1)).replace(".", ",")} par booster` : `1 booster sur ${Math.round(1 / k).toLocaleString("fr-FR")}`;
/* chance de tirer CETTE carte précise : la rareté est répartie entre toutes ses cartes */
const cardOdds = c => "Chance de la tirer : " + oddsText(PER_PACK[c.set][c.rarity] / POOL[c.set][c.rarity].length);

/* niveau d'effets d'une carte : sa rareté, ou sa cote si elle vaut très cher */
function level(card) {
  const p = priceOf(card), byPrice = p >= 500_00 ? 5 : p >= 100_00 ? 4 : p >= 30_00 ? 3 : 0;
  return Math.max(RARITY[card.rarity].rank, byPrice);
}
function collect(card) {
  const isNew = !has(card.id);

  const pl = (save.pulled[card.set] ||= {});
  pl[card.rarity] = (pl[card.rarity] || 0) + 1;
  if (level(card) >= 2) { save.hits.unshift(card.id); save.hits = save.hits.slice(0, 40); }
  return isNew;
}

/* ---------- Rendu d'une carte ---------- */

      </div>

  const img = el.querySelector("img"), face = el.querySelector(".face");

}

  let h = 7; for (const ch of x.u) h = (h * 31 + ch.charCodeAt(0)) % 1e8;   // numéro de certificat fixe pour chaque carte

  el.innerHTML = `<div class="case"><div class="ridge"></div>
    <div class="lbl">
      <div><div class="t">${set.year} Pokémon ${set.name}</div><div class="t nm">${card.name}</div><div class="t">#${card.num.split(/[ /]/)[0]} · ${R.label}</div></div>
      <div class="gr"><span class="gn">${G[1]}</span><span class="gd">${x.g}</span></div>

  el.querySelector(".well").appendChild(cardEl(card, { tilt: false, lazy }));
  if (price) el.insertAdjacentHTML("beforeend", `<div class="price${gradedPrice(x) >= 20_00 ? " big" : ""}">${fmt(gradedPrice(x))}</div>`);

const priceTag = c => `<div class="price${priceOf(c) >= 20_00 ? " big" : ""}">${fmt(priceOf(c))}</div>`;
function attachTilt(el) {

    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    el.style.setProperty("--mx", (x * 100) + "%");
    el.style.setProperty("--my", (y * 100) + "%");
    el.style.setProperty("--rx", ((0.5 - y) * 22) + "deg");
    el.style.setProperty("--ry", ((x - 0.5) * 26) + "deg");
    el.classList.add("active");

  el.addEventListener("pointerleave", () => {
    el.classList.remove("active");
    el.style.removeProperty("--mx"); el.style.removeProperty("--my");

/* =====================================================================
   EFFETS : particules, flash, bannière, toast
   ===================================================================== */
const fx = document.getElementById("fx"), ctx = fx.getContext("2d");
let parts = [], fxRunning = false;
function sizeFx() { fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; }
sizeFx(); addEventListener("resize", sizeFx);
function burst(x, y, color, n = 60, power = 9) {
  const colors = Array.isArray(color) ? color : [color, "#ffffff"];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (0.3 + Math.random()) * power;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 1, d: 0.008 + Math.random() * 0.012,
      size: 2 + Math.random() * 4, c: rnd(colors), star: Math.random() < .4, rot: Math.random() * 6 });
  }

}
/* onde de choc : anneaux lumineux qui s'élargissent depuis la carte (remplace les confettis) */
function shockwave(x, y, colors) {
  [0, 9, 18].forEach((delay, k) => parts.push({ x, y, vx: 0, vy: 0, ring: true, r: 10, vr: 9 - k * 1.5, wait: delay,
    life: 1, d: 0.022, c: colors[k % colors.length], w: 6 - k * 1.5 }));

}
function drawStar(x, y, r) {

  parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 50);
  for (const p of parts) {
    if (p.ring) {

      p.r += p.vr; p.vr *= .97; p.life -= p.d;
      ctx.globalAlpha = Math.max(0, p.life); ctx.strokeStyle = p.c; ctx.lineWidth = p.w * p.life + .5;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.stroke();
      continue;
    }
    p.x += p.vx; p.y += p.vy; p.vy += p.rect ? 0.02 : 0.18; p.vx *= .99; p.life -= p.d; p.rot += .1;
    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.c;
    if (p.rect) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
    else if (p.star) drawStar(p.x, p.y, p.size * 1.6);
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  if (parts.length) requestAnimationFrame(tick); else { fxRunning = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
}
function flash(color) {
  const f = document.getElementById("flash");
  f.style.setProperty("--fc", color); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
}
function banner(text, color, sub = "") {

  b.textContent = text;
  if (sub) { const s = document.createElement("small"); s.textContent = sub; b.appendChild(s); }
  b.style.setProperty("--bc", color);
  b.classList.remove("go"); void b.offsetWidth; b.classList.add("go");
  bannerAt = Date.now();
}
let bannerAt = 0;
/* bannière "de bonus" : attend la fin de celle en cours (un hit passe en premier) */
function bannerLater(text, color, sub) {
  const at = Math.max(Date.now(), bannerAt + 2500, laterAt + 2500); laterAt = at;
  setTimeout(() => { banner(text, color, sub); shockwave(innerWidth / 2, innerHeight / 2, [color, "#fff", "#4ce08a"]); }, at - Date.now());
}
let laterAt = 0;
let toastT;

  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2600);
