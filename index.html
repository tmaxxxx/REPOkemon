const wait = ms => new Promise(r => setTimeout(r, ms));

/* =====================================================================
   OUVERTURE DU BOOSTER
   ===================================================================== */
const pack = document.getElementById("pack"), deck = document.getElementById("deck"),
      summary = document.getElementById("summary"), hint = document.getElementById("hint"),
      btnFast = document.getElementById("btnFast"), picker = document.getElementById("picker"),
      controls = document.getElementById("openControls");
let state = "pack";          // pack -> opening -> deck -> summary
let current = [], idx = 0, busy = false, newFlags = [];
const TOUCH = matchMedia("(hover: none)").matches;   // téléphone / tablette : on « touche », on ne « clique » pas
const TAP = TOUCH ? "Touche" : "Clique";
const HINT = TOUCH ? "Touche le booster pour l'ouvrir (ou glisse le long des pointillés)"
  : "Clique sur le booster pour l'ouvrir (ou glisse le long des pointillés pour le déchirer)";
/* save.sel = une série (boosters achetés) ou "free" (boosters gratuits de la série save.freeSet) */
const FREE = "free";
const curSet = () => save.sel === FREE ? save.freeSet : save.sel;
const left = () => save.sel === FREE ? save.free : save.boosters[save.sel] || 0;
function take(n) {
  if (save.sel === FREE) { save.free -= n; if (!save.free) save.freeAt = Date.now() + FREE_EVERY; }
  else save.boosters[save.sel] -= n;
  save.packs[curSet()] = (save.packs[curSet()] || 0) + n;
}
const packPrice = () => save.sel === FREE ? 0 : boosterOf(save.sel).price;
const mmss = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); };

/* habille le booster avec la vraie photo du booster de la série choisie */
function dressPack() {
  const p = PROD[SET[curSet()].booster], img = new Image();
  img.onload = () => pack.style.setProperty("--ar", img.naturalWidth / img.naturalHeight);
  img.src = p.img;
  pack.style.setProperty("--pimg", `url("${p.img}")`);
}

/* barre de choix des boosters possédés + état du stage */
function renderPicker() {
  const owned = SETS.filter(s => save.boosters[s.id] > 0);
  if (!isUnlocked(save.freeSet)) save.freeSet = "30th";
  if (!left()) save.sel = save.free ? FREE : owned[0]?.id || FREE;
  picker.innerHTML = "";
  // les boosters gratuits, en premier : on choisit la série parmi celles débloquées
  const fb = document.createElement("div");   // pas un <button> : il contient un menu déroulant
  fb.className = "pchip free" + (save.sel === FREE ? " on" : "") + (save.free ? "" : " wait");
  fb.setAttribute("role", "button");
  if (state !== "pack") fb.setAttribute("disabled", "");
  fb.innerHTML = save.free
    ? `<span class="gift">🎁</span><span>Gratuits<br><b>×${save.free}</b></span>
       <select>${SETS.filter(s => isUnlocked(s.id)).map(s => `<option value="${s.id}"${s.id === save.freeSet ? " selected" : ""}>${s.name}</option>`).join("")}</select>`
    : `<span class="gift">🎁</span><span>10 gratuits<br>dans <b id="freeTimer">${mmss(save.freeAt - Date.now())}</b></span>`;
  fb.onclick = e => { if (e.target.tagName === "SELECT" || !save.free) return; save.sel = FREE; persist(); renderPicker(); };
  const sel = fb.querySelector("select");
  if (sel) { sel.onclick = e => e.stopPropagation();
    sel.onchange = () => { save.freeSet = sel.value; save.sel = FREE; persist(); renderPicker(); }; }
  picker.appendChild(fb);
  owned.forEach(s => {
    const b = document.createElement("button");
    b.className = "pchip" + (s.id === save.sel ? " on" : "");
    b.disabled = state !== "pack";
    b.innerHTML = `<img src="${PROD[s.booster].img}" alt=""><span>${s.name}<br><b>×${save.boosters[s.id]}</b></span>`;
    b.onclick = () => { save.sel = s.id; persist(); renderPicker(); };
    picker.appendChild(b);
  });
  // la prochaine série à débloquer, pour donner envie de continuer
  const nl = nextLock();
  document.getElementById("nextunlock").innerHTML = `${nl
    ? `Prochaine série : <b>${nl.name}</b> dans ${(nl.unlock - opened()).toLocaleString("fr-FR")} boosters`
    : "Toutes les séries sont débloquées ✓"}`;
  if (state === "pack") {
    const has = left() > 0;
    pack.classList.toggle("gone", !has);
    summary.hidden = has;
    if (!has) {
      summary.innerHTML = `<div class="nopack"><div class="big">Plus de booster !</div>
        <div>Tes 10 boosters gratuits reviennent dans <b id="freeTimer2">${mmss(save.freeAt - Date.now())}</b>.<br>
        En attendant, la boutique a des boosters, des displays et des ETB.</div>
        <button class="btn" id="goShop">Aller à la boutique · ${fmt(save.money)}</button></div>`;
      summary.querySelector("#goShop").onclick = () => show("shop");
    }
    dressPack();
    hint.textContent = has ? HINT : "";
    btnFast.disabled = left() < 2;
    controls.hidden = !has;
    btnFast.textContent = `⚡ Ouvrir ×${Math.min(10, Math.max(2, left()))} d'un coup · ${fmt(FAST_FEE)}${TOUCH ? "" : " · touche O"}`;
  }
}

/* déchirer en glissant le long des pointillés : la déchirure suit le curseur */
const top_ = pack.querySelector(".pack-top"), prog = pack.querySelector(".tearprog");
let drag = null, dragged = false;
const CUT = .13;   // même valeur que --cut en CSS : hauteur de la bande du haut
function onLine(e) {   // le curseur est-il sur (ou tout près de) la ligne pointillée ?
  const r = pack.getBoundingClientRect(), y = r.top + r.height * CUT;
  return Math.abs(e.clientY - y) < Math.max(32, r.height * .1) && e.clientX > r.left - 16 && e.clientX < r.right + 16;
}
function tearAt(e) {   // position du curseur le long de la ligne, de 0 à 1
  const r = pack.getBoundingClientRect();
  return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
}
pack.addEventListener("pointerdown", e => {
  dragged = false;   // remis à zéro à chaque appui : un simple clic n'importe où sur le booster l'ouvre toujours
  if (state === "pack" && !onLine(e)) {   // ailleurs que sur les pointillés : on attrape le booster pour le faire tourner
    spin = { x: e.clientX, y: e.clientY }; rot.vy = 0;
    pack.setPointerCapture(e.pointerId); return;
  }
  if (state !== "pack") return;
  const x = tearAt(e);
  drag = { from: x, dir: x < .5 ? 1 : -1 };   // on déchire depuis le bord le plus proche
  pack.setPointerCapture(e.pointerId); pack.classList.add("tearing");
  prog.style.left = drag.dir > 0 ? "3%" : "auto"; prog.style.right = drag.dir > 0 ? "auto" : "3%";
  dragged = false;
});
pack.addEventListener("pointermove", e => {
  const r = pack.getBoundingClientRect();
  mouse = { x: (e.clientX - r.left) / r.width - .5, y: (e.clientY - r.top) / r.height - .5 };
  if (spin) {
    const dx = e.clientX - spin.x, dy = e.clientY - spin.y;
    if (Math.abs(dx) + Math.abs(dy) > 5) { dragged = true; pack.classList.add("spinning"); }
    rot.ry += dx * .6; rot.vy = Math.max(-35, Math.min(35, dx * .6)); rot.rx = Math.max(-30, Math.min(30, rot.rx - dy * .3));
    spin = { x: e.clientX, y: e.clientY }; return;
  }
  if (!drag) { pack.classList.toggle("near", state === "pack" && onLine(e)); return; }
  const x = tearAt(e), p = drag.dir > 0 ? x : 1 - x;
  if (Math.abs(x - drag.from) > .04) dragged = true;
  prog.style.width = (Math.min(1, p) * 94) + "%";
  if (p >= .9 && Math.abs(x - drag.from) > .35) { drag = null; pack.classList.remove("tearing", "near"); openPack(); }
});
const endTear = () => {
  pack.classList.remove("near");
  if (spin) { spin = null; pack.classList.remove("spinning"); }
  if (!drag) return;
  drag = null; pack.classList.remove("tearing");
  prog.style.transition = "width .3s"; prog.style.width = "0"; setTimeout(() => prog.style.transition = "", 300);
};
pack.addEventListener("pointerup", endTear);
pack.addEventListener("pointerleave", () => { mouse = null; if (!drag) pack.classList.remove("near"); });

/* 3D : épaisseur (calques sombres empilés), inclinaison vers la souris, rotation lancée à la main avec élan */
const pack3d = pack.querySelector(".pack3d");
for (let i = 1; i <= 6; i++) {
  const l = document.createElement("div"); l.className = "pack-layer"; l.style.setProperty("--z", -i + "px");
  pack3d.prepend(l);
}
let spin = null, mouse = null;
const rot = { rx: 0, ry: 0, vy: 0 };
(function turn(t) {
  requestAnimationFrame(turn);
  if (pack.classList.contains("gone") || document.getElementById("view-open").hidden) return;
  if (!spin) {
    let tx, ty;
    if (state !== "pack" || drag || pack.classList.contains("near")) tx = ty = 0;        // bien à plat pour déchirer
    else if (mouse) { tx = -mouse.y * 26; ty = mouse.x * 36; }                           // suit la souris
    else { tx = Math.sin(t / 1700) * 4; ty = Math.sin(t / 2300) * 16; }                  // se balance tout seul
    if (Math.abs(rot.vy) > .3) { rot.ry += rot.vy; rot.vy *= .95; }                      // élan après un lancer
    else {
      rot.vy = 0;
      rot.ry -= Math.round((rot.ry - ty) / 360) * 360;   // revient par le chemin le plus court
      rot.ry += (ty - rot.ry) * .08;
    }
    rot.rx += (tx - rot.rx) * .08;
  }
  pack.style.setProperty("--rx", rot.rx.toFixed(2) + "deg");
  pack.style.setProperty("--ry", rot.ry.toFixed(2) + "deg");
  pack.style.setProperty("--gx", (50 + rot.ry * 1.6) + "%");
  pack.style.setProperty("--gy", (30 - rot.rx * 2) + "%");
})(0);
pack.addEventListener("click", () => { if (state === "pack" && !dragged) openPack(); });

async function openPack() {
  if (state !== "pack" || left() < 1) return;
  state = "opening"; btnFast.disabled = true; controls.hidden = true; hint.textContent = "";
  take(1);
  current = makePack(curSet()); idx = 0; newFlags = [];
  persist(); updateCounter(); renderPicker();

  pack.classList.add("shake");
  await wait(450);
  pack.classList.remove("shake");
  prog.style.width = "100%";
  const r = top_.getBoundingClientRect();
  burst(r.left + r.width / 2, r.bottom, ["#ffd76a", "#ffffff", "#ff4fa0", "#2ff5c8"], 70, 8);
  pack.classList.add("opening");
  await wait(500);
  buildDeck();
  await wait(700);
  pack.classList.add("gone");
  reveal(0);
  state = "deck";
}

function buildDeck() {
  deck.innerHTML = "";
  current.forEach((card, i) => {
    const f = document.createElement("div");
    f.className = "fcard enter";
    f.style.setProperty("--rc", RARITY[card.rarity].color);
    f.appendChild(cardEl(card));
    f.insertAdjacentHTML("beforeend", `<div class="rlabel">${RARITY[card.rarity].label}<br><span class="pr">${fmt(priceOf(card))}</span></div>`);
    f.style.zIndex = 100 - i;
    deck.appendChild(f);
    setTimeout(() => f.classList.remove("enter"), 60 + i * 70);
  });
  restack();
}
function restack() {
  [...deck.children].forEach((f, k) => {
    if (f.classList.contains("out")) return;
    const j = k - idx;
    f.style.transform = `translate(${j * 3}px, ${-j * 3}px) rotate(${j === 0 ? 0 : (j % 2 ? 1.5 : -1.5) * Math.min(j, 3)}deg)`;
  });
}

/* la carte du dessus devient visible : on l'ajoute à la collection + effets */
function reveal(i) {
  const f = deck.children[i], card = current[i], R = RARITY[card.rarity], lv = level(card);
  const isNew = fast ? newFlags[i] : collect(card);   // ouverture ×10 : déjà rangées dans la collection
  if (!fast) { persist(); updateCounter(); newFlags[i] = isNew; }
  if (isNew) { const t = document.createElement("div"); t.className = "tag"; t.textContent = "NEW"; f.appendChild(t); }
  f.classList.add("shown", "pop");
  if (lv >= 2) f.classList.add("hit");
  const r = f.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  if (lv >= 2) {
    burst(cx, cy, [R.color, "#ffffff", R.color], 40 + lv * 30, 6 + lv * 2);
    banner(R.label + " !", R.color, priceOf(card) >= 10_00 ? card.name + " · " + fmt(priceOf(card)) : "");
  } else if (lv === 1) burst(cx, cy, [R.color, "#ffffff"], 25, 5);
  if (lv >= 4) { flash(R.color); shockwave(cx, cy, [R.color, "#ffffff", "#ffd76a"]); }
  hint.textContent = i < current.length - 1 ? `${TAP} pour la carte suivante, ou fais-la glisser vers le haut pour dévoiler lentement (${i + 1}/${current.length})` : `${TAP} pour voir ton booster`;
}

deck.addEventListener("click", () => { if (peeled) { peeled = false; return; } advance(); });

/* Dévoiler lentement : maintenir la carte du dessus et la faire glisser vers le haut découvre peu à peu celle de derrière.
   Lâchée après 40 % de sa hauteur, elle s'envole ; avant, elle revient en place. Un simple clic passe toujours à la suivante. */
let peel = null, peeled = false;
deck.addEventListener("pointerdown", e => {
  if (state !== "deck" || busy || e.button > 0) return;
  const top = deck.children[idx];
  if (!top || !top.contains(e.target)) return;
  peel = { top, id: e.pointerId, x0: e.clientX, y0: e.clientY, h: top.getBoundingClientRect().height, on: false, p: 0 };
  peeled = false;
});
addEventListener("pointermove", e => {
  if (!peel || e.pointerId !== peel.id) return;
  const dy = Math.min(0, e.clientY - peel.y0), dx = e.clientX - peel.x0;
  if (!peel.on) {
    if (dy > -8) return;   // en dessous de 8 px, c'est encore un clic
    peel.on = peeled = true;
    peel.top.classList.add("peeling");
  }
  peel.p = Math.min(1, -dy / peel.h);
  peel.top.style.transform = `translate(${dx * .15}px, ${dy}px) rotate(${dx * .02 - peel.p * 3}deg)`;
});
const endPeel = e => {
  if (!peel || e.pointerId !== peel.id) return;
  const { top, on, p } = peel;
  peel = null;
  if (!on) return;
  top.classList.remove("peeling");
  if (p > .4) advance(true); else restack();
};
addEventListener("pointerup", endPeel);
addEventListener("pointercancel", endPeel);
addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
  if (document.getElementById("view-open").hidden || !document.getElementById("modal").hidden) return;
  if (e.code === "Space" || e.key === "Enter") {
    e.preventDefault();
    if (state === "pack") openPack(); else if (state === "deck") advance(); else if (state === "summary") resetStage();
  }
  // O = ouverture rapide ×10 (depuis le booster fermé ou le récap)
  if (e.key.toLowerCase() === "o" && !e.metaKey && !e.ctrlKey && !e.altKey && !e.repeat) {
    if (state === "summary") resetStage();
    if (state === "pack" && !controls.hidden && !btnFast.disabled) btnFast.click();
  }
});

async function advance(up = false) {
  if (state !== "deck" || busy) return;
  busy = true;
  const top = deck.children[idx];
  if (up) top.classList.add("up");   // dévoilée en glissant : elle s'envole vers le haut
  if (idx >= current.length - 1) {
    top.classList.add("out");
    await wait(350);
    if (fast) fastSummary(); else showSummary();
    busy = false; return;
  }
  top.classList.add("out");
  idx++;
  restack();
  await wait(120);
  reveal(idx);
  await wait(250);
  busy = false;
}

/* récap : valeur du (des) booster(s) comparée au prix payé */
function showSummary(cards = current, flags = newFlags, title = "Ton booster", nbPacks = 1) {
  state = "summary"; deck.innerHTML = ""; controls.hidden = true;
  summary.hidden = false;
  const value = cards.reduce((a, c) => a + priceOf(c), 0);
  const paid = packPrice() * nbPacks;
  const diff = value - paid;
  summary.innerHTML = `<div class="sumtitle">${title}</div>
    <div class="sumval">Valeur des cartes : <b>${fmt(value)}</b> · prix ${nbPacks > 1 ? "des boosters" : "du booster"} : <b>${paid ? fmt(paid) : "gratuit"}</b>
      → <span class="${diff >= 0 ? "up" : "down"}">${diff >= 0 ? "+" : "−"}${fmt(Math.abs(diff))}</span></div>
    <div class="sumrow"></div>
    <div class="controls">
      <button class="btn" id="again">${left() ? `Ouvrir un autre booster (${left()})` : save.free || Object.values(save.boosters).some(n => n > 0) ? "Choisir un autre booster" : "Acheter des boosters"}</button>
      <button class="btn green" id="sellAll">Tout revendre · +${fmt(cards.reduce((a, c) => a + sellPrice(priceOf(c)), 0))}</button>
      <button class="btn ghost" id="toBinder">Voir le classeur</button>
    </div>`;
  const row = summary.querySelector(".sumrow");
  cards.forEach((c, i) => {
    const s = document.createElement("div"); s.className = "slot"; s.style.animationDelay = (i * 0.05) + "s";
    const el = cardEl(c, { price: true }); if (level(c) >= 2) el.style.boxShadow = `0 0 24px ${RARITY[c.rarity].color}`;
    s.appendChild(el);
    if (flags[i]) { const t = document.createElement("div"); t.className = "tag"; t.textContent = "NEW"; s.appendChild(t); }
    s.onclick = () => openModal(c);
    row.appendChild(s);
  });
  summary.querySelector("#again").onclick = () => left() || save.free || Object.values(save.boosters).some(n => n > 0) ? resetStage() : show("shop");
  const sellBtn = summary.querySelector("#sellAll");
  sellBtn.onclick = () => {
    let total = 0;
    for (const c of cards) if (save.owned[c.id] > 0) { total += sellPrice(priceOf(c)); removeCard(c.id); }
    gain(total); persist(); updateCounter(true);
    sellBtn.disabled = true; sellBtn.textContent = "Vendu ✓";
    toast(`Cartes revendues : +${fmt(total)}`);
  };
  summary.querySelector("#toBinder").onclick = () => { binderSet = curSet(); show("binder"); };
  hint.textContent = "";
}

function resetStage() {
  fast = null;
  summary.hidden = true; summary.innerHTML = ""; deck.innerHTML = "";
  pack.className = "pack"; prog.style.width = "0";
  state = "pack";
  renderPicker();
}

/* ouverture rapide : jusqu'à 10 boosters d'un coup, on n'affiche que les meilleures cartes */
/* ouverture ×10 : tous les boosters sont ouverts d'un coup, puis on fait défiler UNIQUEMENT les hits
   (du moins cher au plus cher : le meilleur arrive en dernier), et le récap compte toutes les cartes */
let fast = null;   // { all, n, price, hits, flags } pendant une ouverture ×10
btnFast.onclick = async () => {
  if (state !== "pack" || left() < 2) return;
  if (!pay(FAST_FEE)) return nope(btnFast, `L'ouverture rapide coûte ${fmt(FAST_FEE)} : ouvre tes boosters à la main !`);
  const n = Math.min(10, left()), got = [], flags = [], all = [];
  const setId = curSet(), price = packPrice();
  take(n);
  for (let p = 0; p < n; p++) {
    for (const c of makePack(setId)) {
      const isNew = collect(c); all.push(c);
      if (level(c) >= 2 || priceOf(c) >= 5_00) { got.push(c); flags.push(isNew); }
    }
  }
  persist(); updateCounter();
  const order = got.map((c, i) => [c, flags[i]]).sort((a, b) => priceOf(a[0]) - priceOf(b[0]));
  fast = { all, n, price, hits: order.map(o => o[0]), flags: order.map(o => o[1]) };
  state = "opening"; renderPicker(); btnFast.disabled = true; controls.hidden = true; hint.textContent = "";
  // même ouverture qu'un booster normal
  pack.classList.add("shake");
  await wait(450);
  pack.classList.remove("shake");
  prog.style.width = "100%";
  const r = top_.getBoundingClientRect();
  burst(r.left + r.width / 2, r.bottom, ["#ffd76a", "#ffffff", "#ff4fa0", "#2ff5c8"], 90, 9);
  pack.classList.add("opening");
  await wait(500);
  if (!fast.hits.length) { pack.classList.add("gone"); return fastSummary(); }
  current = fast.hits; newFlags = fast.flags; idx = 0;
  banner(`${fast.hits.length} hit${fast.hits.length > 1 ? "s" : ""} !`, "#f0c674", `dans tes ${n} boosters`);
  buildDeck();
  await wait(700);
  pack.classList.add("gone");
  reveal(0);
  state = "deck";
};
/* récap de l'ouverture ×10 : les hits (du plus cher au moins cher) + la valeur de TOUTES les cartes */
function fastSummary() {
  const { all, n, price } = fast, hits = [...fast.hits].reverse(), flags = [...fast.flags].reverse(), rest = all.length - hits.length;
  showSummary(hits, flags, hits.length ? `${n} boosters · ${hits.length} hit${hits.length > 1 ? "s" : ""}` : `${n} boosters… aucun hit 😭`, n);
  const value = all.reduce((a, c) => a + priceOf(c), 0), paid = price * n + FAST_FEE, diff = value - paid;
  summary.querySelector(".sumval").innerHTML = `Valeur des ${all.length} cartes : <b>${fmt(value)}</b> · ${price ? "prix des boosters + frais ×10" : "frais ×10 (boosters gratuits)"} : <b>${fmt(paid)}</b>
    → <span class="${diff >= 0 ? "up" : "down"}">${diff >= 0 ? "+" : "−"}${fmt(Math.abs(diff))}</span>
    <br><span style="font-size:13px">(+ ${rest} cartes à moins de 5 $, rangées dans le classeur)</span>`;
  const sellBtn = summary.querySelector("#sellAll");
  sellBtn.textContent = `Tout revendre · +${fmt(all.reduce((a, c) => a + sellPrice(priceOf(c)), 0))}`;
  sellBtn.onclick = () => {
    let total = 0;
    for (const c of all) if (save.owned[c.id] > 0) { total += sellPrice(priceOf(c)); removeCard(c.id); }
    gain(total); persist(); updateCounter(true);
    sellBtn.disabled = true; sellBtn.textContent = "Vendu ✓";
    toast(`${all.length} cartes revendues : +${fmt(total)}`);
  };
}

/* =====================================================================
   RÉSERVE : les produits possédés sur des étagères, en 3D (vraies photos)
   ===================================================================== */
const DEPTH = { booster: 6, bundle: 12, etb: 16, display: 16 };   // épaisseur en px
/* objet 3D fait avec la photo du produit : face (coupée en deux pour le couvercle), épaisseur, dos, reflet */
function obj3d(p) {
  const o = document.createElement("div"); o.className = "obj";
  o.style.setProperty("--img", `url("${p.img}")`);
  const img = new Image();
  img.onload = () => o.style.setProperty("--ar", img.naturalWidth / img.naturalHeight);
  img.src = p.img;
  const d = DEPTH[p.kind] || 8;
  let layers = "";
  for (let z = 1.5; z < d; z += 1.5) layers += `<div class="olayer" style="--z:${-z}px"></div>`;
  o.innerHTML = `<div class="o3d">${layers}<div class="oback" style="--z:${-d}px"></div>
    <div class="oface otop"></div><div class="oface obot"></div><div class="oglare"></div></div>`;
  return o;
}
function tiltTo(o, rx, ry) {
  o.style.setProperty("--rx", rx.toFixed(2) + "deg"); o.style.setProperty("--ry", ry.toFixed(2) + "deg");
  o.style.setProperty("--gx", 50 + ry * 1.6 + "%"); o.style.setProperty("--gy", 30 - rx * 2 + "%");
}
/* s'incline vers la souris quand on la passe dessus */
function tiltable(o) {
  o.addEventListener("pointermove", e => {
    const r = o.getBoundingClientRect();
    tiltTo(o, -((e.clientY - r.top) / r.height - .5) * 24, ((e.clientX - r.left) / r.width - .5) * 34);
  });
  o.addEventListener("pointerleave", () => tiltTo(o, 0, 0));
}
/* en grand : suit la souris, se balance tout seul, et tourne quand on le lance (même principe que le booster) */
function spinnable(o) {
  const rot = { rx: 0, ry: 0, vy: 0 };
  let grab = null, hover = null;
  o.classList.add("live");
  o.addEventListener("pointerdown", e => { grab = { x: e.clientX, y: e.clientY }; rot.vy = 0; o.setPointerCapture(e.pointerId); o.classList.add("grabbing"); });
  o.addEventListener("pointermove", e => {
    const r = o.getBoundingClientRect();
    hover = { x: (e.clientX - r.left) / r.width - .5, y: (e.clientY - r.top) / r.height - .5 };
    if (!grab) return;
    const dx = e.clientX - grab.x, dy = e.clientY - grab.y;
    rot.ry += dx * .6; rot.vy = Math.max(-35, Math.min(35, dx * .6)); rot.rx = Math.max(-30, Math.min(30, rot.rx - dy * .3));
    grab = { x: e.clientX, y: e.clientY };
  });
  const release = () => { grab = null; o.classList.remove("grabbing"); };
  o.addEventListener("pointerup", release); o.addEventListener("pointercancel", release);
  o.addEventListener("pointerleave", () => hover = null);
  requestAnimationFrame(function turn(t) {
    if (!o.isConnected) return;   // l'objet a été retiré : on arrête
    requestAnimationFrame(turn);
    if (grab) return tiltTo(o, rot.rx, rot.ry);
    let tx, ty;
    if (o.classList.contains("still")) tx = ty = 0;
    else if (hover) { tx = -hover.y * 22; ty = hover.x * 32; }
    else { tx = Math.sin(t / 1700) * 4; ty = Math.sin(t / 2300) * 18; }
    if (Math.abs(rot.vy) > .3) { rot.ry += rot.vy; rot.vy *= .95; }
    else { rot.vy = 0; rot.ry -= Math.round((rot.ry - ty) / 360) * 360; rot.ry += (ty - rot.ry) * .08; }
    rot.rx += (tx - rot.rx) * .08;
    tiltTo(o, rot.rx, rot.ry);
  });
}

function renderReserve() {
  const box = document.getElementById("reserve"), rows = stock();
  const total = rows.reduce((a, r) => a + r.p.price * r.n, 0), nb = rows.reduce((a, r) => a + r.n, 0);
  box.innerHTML = `<div class="rhead"><h2>Réserve</h2>
    <div class="rsub"><b>${nb}</b> objet${nb > 1 ? "s" : ""} · valeur <b>${fmt(total)}</b></div></div>`;
  if (!rows.length) {
    box.insertAdjacentHTML("beforeend", `<div class="empty">Ta réserve est vide. Les produits achetés en boutique arrivent ici.</div>`);
    return;
  }
  for (const s of SETS) {
    const mine = rows.filter(r => r.p.set === s.id);
    if (!mine.length) continue;
    const shelf = document.createElement("div"); shelf.className = "shelf";
    shelf.innerHTML = `<div class="shelf-t"><i style="background:${s.color}"></i>${s.name}</div><div class="shelf-row"></div>`;
    for (const r of mine) {
      const it = document.createElement("button"); it.className = "ritem";
      const o = obj3d(r.p); tiltable(o);
      it.append(o);
      it.insertAdjacentHTML("beforeend", `<span class="rn">×${r.n}</span><div class="rname">${r.p.name}</div><div class="rval">${fmt(r.p.price)} pièce</div>`);
      it.onclick = () => inspect(r);
      shelf.querySelector(".shelf-row").append(it);
    }
    box.append(shelf);
  }
}

const vault = document.getElementById("vault");
function closeVault() { vault.hidden = true; vault.innerHTML = ""; }
vault.addEventListener("click", e => { if (e.target === vault) closeVault(); });
addEventListener("keydown", e => { if (e.key === "Escape" && !vault.hidden) closeVault(); });

/* un produit en grand : on le fait tourner, on l'ouvre ou on le revend */
function inspect(r) {
  const { p, booster } = r, n = booster ? save.boosters[p.set] || 0 : save.sealed[p.id] || 0;
  if (!n) { closeVault(); return renderReserve(); }
  vault.hidden = false;
  vault.innerHTML = `<div class="vbox"><button class="vclose" aria-label="Fermer">✕</button><div class="vstage"></div>
    <div><div class="vt">${p.name}</div><div class="vs">${SET[p.set].name}${booster ? "" : " · " + p.sub}</div></div>
    <div class="vs">Tu en as <b>${n}</b> · cote <b>${fmt(p.price)}</b> pièce</div>
    <div class="vbtns"></div><div class="vhint">Attrape-le pour le faire tourner</div></div>`;
  vault.querySelector(".vclose").onclick = closeVault;
  const o = obj3d(p);
  vault.querySelector(".vstage").append(o);
  spinnable(o);
  const btns = vault.querySelector(".vbtns");
  const open = document.createElement("button"); open.className = "btn";
  open.textContent = booster ? "Aller l'ouvrir" : `Ouvrir (${p.packs} boosters)`;
  open.onclick = () => {
    if (booster) { save.sel = p.set; persist(); closeVault(); return show("open"); }
    openSealed(p, o);
  };
  const sell = document.createElement("button"); sell.className = "btn green";
  sell.textContent = `Revendre 1 · +${fmt(sellPrice(p.price))}`;
  sell.onclick = () => {
    if (booster) save.boosters[p.set]--; else save.sealed[p.id]--;
    gain(sellPrice(p.price)); persist(); updateCounter(true);
    toast(`${p.name} revendu : +${fmt(sellPrice(p.price))}`);
    renderReserve(); inspect(r);
  };
  btns.append(open, sell);
}

/* ouverture d'un produit scellé : le couvercle s'envole, les vrais boosters de la série sortent en éventail */
async function openSealed(p, o) {
  if (!(save.sealed[p.id] > 0)) return;
  save.sealed[p.id]--; save.boosters[p.set] = (save.boosters[p.set] || 0) + p.packs; save.sel = p.set;
  persist(); updateCounter(); renderReserve();
  vault.querySelector(".vbtns").innerHTML = ""; vault.querySelector(".vhint").textContent = "";
  o.classList.add("still"); await wait(450);
  o.classList.add("shakeo"); await wait(500); o.classList.remove("shakeo");
  o.classList.add("lidoff");
  const r = o.getBoundingClientRect(), color = SET[p.set].color;
  burst(r.left + r.width / 2, r.top + r.height * .3, [color, "#ffffff", "#ffd76a"], 90, 10);
  await wait(500);

  const stage = vault.querySelector(".vstage"), fan = document.createElement("div"); fan.className = "vfan";
  stage.append(fan);
  const N = p.packs, W = stage.clientWidth, H = stage.clientHeight, bp = boosterOf(p.set);
  for (let i = 0; i < N; i++) {
    const b = obj3d(bp); tiltable(b);
    let h, tx, ty, rot;
    if (N <= 12) {   // en éventail
      const k = N > 1 ? i / (N - 1) - .5 : 0, spread = Math.min(W * .6, N * 74);
      h = Math.min(H * .62, N > 6 ? 150 : 190, (W - spread) * .8 / .55); tx = k * spread; ty = k * k * 90; rot = k * Math.min(50, N * 5);
    } else {         // display : 36 boosters en grille
      const cols = 9, rows = Math.ceil(N / cols), c = i % cols, l = Math.floor(i / cols);
      h = Math.min(H / (rows + .4), 96); tx = (c - (cols - 1) / 2) * Math.min(W / cols, h * .62); ty = (l - (rows - 1) / 2) * h * .92; rot = (Math.random() - .5) * 10;
    }
    b.style.cssText += `--h:${h}px;--tx:${tx}px;--ty:${ty}px;--rot:${rot}deg;--dl:${Math.round(i * Math.min(90, 1400 / N))}ms`;
    fan.append(b);
  }
  o.remove();
  await wait(Math.min(90, 1400 / N) * N + 500);
  const vt = vault.querySelector(".vt"); vt.textContent = `+${N} boosters !`; vt.style.color = color;
  vault.querySelectorAll(".vs")[1].innerHTML = `Il te reste <b>${save.sealed[p.id] || 0}</b> ${p.name} · <b>${save.boosters[p.set]}</b> boosters ${SET[p.set].name} à ouvrir`;
  const btns = vault.querySelector(".vbtns");
  const go = document.createElement("button"); go.className = "btn"; go.textContent = "Ouvrir les boosters";
  go.onclick = () => { closeVault(); show("open"); };
  const back = document.createElement("button"); back.className = "btn ghost"; back.textContent = "Retour à la réserve";
  back.onclick = closeVault;
  btns.append(go, back);
}

let filter = "all", binderSet = "30th";
let selling = false, picked = {};   // mode vente : picked[id] = nombre d'exemplaires à vendre
const FILTERS = [["all", "Toutes"], ["owned", "Possédées"], ["missing", "Manquantes"], ["hits", "Hits"], ["graded", "Gradées"], ["value", "Par cote"]];
function removeCard(id, n = 1) {
  save.owned[id] -= n;
  if (save.owned[id] <= 0) delete save.owned[id];
}
/* ---------- Classeur en livre : 9 pochettes par page, pages qui tournent (clic, flèches, clavier, ou à la main) ---------- */
const bookSpread = {};   // page ouverte par série
function bookPages(list) {
  const pages = [{ cover: true }];
  for (let i = 0; i < list.length; i += 9) pages.push({ cards: list.slice(i, i + 9) });
  return pages;
}
function bookFront() {
  const cards = CARDS.filter(c => c.set === binderSet), have = cards.filter(c => has(c.id)).length;
  // la carte phare : la plus chère de la série (sauf les Mew RGB, aux couleurs inversées, peu lisibles en couverture)
  const pool = cards.filter(c => c.rarity !== "RGB"), chase = pool.reduce((a, c) => priceOf(c) > priceOf(a) ? c : a, pool[0]);
  const el = document.createElement("div");
  el.className = "bfront"; el.style.setProperty("--sc", SET[binderSet].color);
  el.innerHTML = `<div class="spine"></div><div class="art" style="background-image:url('${chase.img}')" title="${chase.name}"></div>
    <img class="logo" src="logos/${binderSet}.webp" alt="${SET[binderSet].name}" onerror="this.remove()"><div class="strap"></div>
    <div class="foot"><span><b>${have}</b> / ${cards.length}</span><span>Ouvrir →</span></div>`;
  return el;
}
function bookPageEl(p, no) {
  const el = document.createElement("div");
  if (p === "none") return el;
  if (!p) { el.className = "bpage blank"; return el; }
  el.className = "bpage";
  if (p.cover) {
    const cards = CARDS.filter(c => c.set === binderSet), have = cards.filter(c => has(c.id)).length;
    const value = cards.reduce((a, c) => a + priceOf(c) * (save.owned[c.id] || 0), 0);
    el.innerHTML = `<div class="bcover"><div class="s">Classeur</div><div class="t">${SET[binderSet].name}</div>
      <div class="big">${have}/${cards.length}</div><div class="bar"><i style="width:${have / cards.length * 100}%"></i></div>
      <div class="s">Valeur de tes cartes : <b style="color:var(--txt)">${fmt(value)}</b></div><div class="go">Tourne la page →</div></div>`;
    return el;
  }
  const g = document.createElement("div"); g.className = "pockets";
  for (let k = 0; k < 9; k++) {
    const c = p.cards[k], pk = document.createElement("div");
    pk.className = "pocket";
    if (!c) pk.classList.add("empty");
    else if (has(c.id)) {
      const raw = save.owned[c.id] || 0, gr = gradedOf(c.id);
      pk.appendChild(cardEl(c, { tilt: false, lazy: true }));
      if (raw + gr.length > 1) pk.insertAdjacentHTML("beforeend", `<div class="count">×${raw + gr.length}</div>`);
      if (gr.length) pk.insertAdjacentHTML("beforeend", `<div class="gbadge">RKG ${gr[0].g}</div>`);
      pk.dataset.id = c.id;
    } else {
      pk.innerHTML = `<div class="miss"><b>${c.num.split(" ")[0]}</b>${c.name}<span style="color:${RARITY[c.rarity].color}66">${RARITY[c.rarity].sym}</span></div>`;
      pk.dataset.id = c.id;
    }
    g.appendChild(pk);
  }
  el.appendChild(g);
  el.insertAdjacentHTML("beforeend", `<div class="pno">${no}</div>`);
  return el;
}
function renderBook(box, list) {
  const pages = bookPages(list), single = matchMedia("(max-width: 760px)").matches, per = single ? 1 : 2;
  const nSp = Math.ceil(pages.length / per);
  let sp = Math.min(bookSpread[binderSet] ?? -1, nSp - 1);   // -1 = classeur fermé
  box.innerHTML = `<div class="book-wrap"><button class="bk-nav" data-d="-1" title="Page précédente (←)">‹</button>
    <div class="book${single ? " single" : ""}"><div class="page-slot bk-left"></div><div class="rings"><i></i><i></i><i></i><i></i></div><div class="page-slot bk-right"></div></div>
    <button class="bk-nav" data-d="1" title="Page suivante (→)">›</button></div>
    <div class="bk-foot"><span class="bk-no"></span><input type="range" min="-1" max="${nSp - 1}" value="${sp}"><span>${list.length} cartes · ${pages.length - 1} pages</span></div>`;
  const book = box.querySelector(".book"), L = box.querySelector(".bk-left"), Rt = box.querySelector(".bk-right");
  const range = box.querySelector("input"), no = box.querySelector(".bk-no");
  const pageAt = i => i === -1 ? bookFront() : i < -1 ? bookPageEl("none") : bookPageEl(pages[i], i);
  const draw = () => {
    bookSpread[binderSet] = sp;
    book.classList.toggle("closed", sp === -1);
    if (single) Rt.replaceChildren(pageAt(sp));
    else { L.replaceChildren(pageAt(2 * sp)); Rt.replaceChildren(pageAt(2 * sp + 1)); }
    range.value = sp;
    no.textContent = sp === -1 ? "Classeur fermé" : sp === 0 ? "Couverture" : single ? `Page ${sp} / ${pages.length - 1}` : `Pages ${2 * sp}–${Math.min(2 * sp + 1, pages.length - 1)}`;
    box.querySelectorAll(".bk-nav").forEach(b => b.disabled = +b.dataset.d < 0 ? sp === -1 : sp >= nSp - 1);
  };
  draw();

  // une feuille qui tourne : recto = page qu'on quitte, verso = page qu'on découvre ; dessous = la page d'après
  let leaf = null, busyFlip = false;
  const makeLeaf = d => {
    const pw = Rt.offsetWidth, onRight = single || d > 0;
    leaf = document.createElement("div"); leaf.className = "leaf";
    leaf.style.left = (onRight ? Rt.offsetLeft : L.offsetLeft) + "px";
    leaf.style.top = Rt.offsetTop + "px";
    leaf.style.transformOrigin = onRight ? "left center" : "right center";
    const f = document.createElement("div"), b = document.createElement("div");
    f.className = "lf"; b.className = "lf lb";
    if (single) {   // une page à la fois : la feuille vient de la droite et se rabat à gauche
      if (d > 0) { f.append(pageAt(sp)); b.append(bookPageEl(null)); Rt.replaceChildren(pageAt(sp + 1)); }
      else { f.append(pageAt(sp - 1)); b.append(bookPageEl(null)); }
    } else if (d > 0) { f.append(pageAt(2 * sp + 1)); b.append(pageAt(2 * sp + 2)); Rt.replaceChildren(pageAt(2 * sp + 3)); }
    else { f.append(pageAt(2 * sp)); b.append(pageAt(2 * sp - 1)); L.replaceChildren(pageAt(2 * sp - 2)); }
    leaf.append(f, b); book.appendChild(leaf);
    if (sp === -1) book.classList.remove("closed");   // on ouvre : le classeur glisse au centre pendant que la couverture tourne
    leaf.d = d; leaf.pw = pw;
    // en simple page, « précédent » part de la position tournée (-180°) et revient à plat
    leaf.from = single && d < 0 ? -180 : 0;
    leaf.to = d > 0 ? -180 : single ? 0 : 180;
    setAngle(leaf.from);
  };
  const setAngle = a => {
    leaf.angle = a;
    leaf.style.transform = `rotateY(${a}deg)`;
    leaf.style.setProperty("--shade", (Math.sin(Math.abs(a) * Math.PI / 180) * .55).toFixed(3));
  };
  const finish = async done => {
    leaf.classList.add("anim"); busyFlip = true;
    setAngle(done ? leaf.to : leaf.from);
    await wait(720);
    if (done) sp += leaf.d;
    leaf.remove(); leaf = null; busyFlip = false; draw();
  };
  const flip = d => {
    if (busyFlip || leaf) return;
    if (d > 0 ? sp >= nSp - 1 : sp <= -1) return;
    makeLeaf(d); leaf.getBoundingClientRect();
    finish(true);
  };
  box.querySelectorAll(".bk-nav").forEach(b => b.onclick = () => flip(+b.dataset.d));
  range.oninput = () => { sp = +range.value; draw(); };
  bookFlip = flip;

  // tourner la page à la main : attraper la page et glisser ; un clic sur une carte ouvre sa fiche
  let drag = null, dragged = false;
  book.addEventListener("pointerdown", e => {
    if (busyFlip || leaf || e.button > 0) return;
    drag = { x0: e.clientX, y0: e.clientY, id: e.pointerId, on: false };
    dragged = false;
  });
  book.addEventListener("pointermove", e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x0;
    if (!drag.on) {
      if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(e.clientY - drag.y0)) return;
      const d = dx < 0 ? 1 : -1;
      if (d > 0 ? sp >= nSp - 1 : sp <= -1) { drag = null; return; }
      drag.on = dragged = true; book.setPointerCapture(e.pointerId);
      makeLeaf(d);
    }
    const k = Math.max(0, Math.min(1, Math.abs(dx) / (leaf.pw * (single ? 1 : 1.6))));
    setAngle(leaf.from + (leaf.to - leaf.from) * k);
    leaf.k = k;
  });
  const end = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const was = drag.on; drag = null;
    if (was && leaf) finish(leaf.k > .3);
  };
  book.addEventListener("pointerup", end);
  book.addEventListener("pointercancel", end);
  book.addEventListener("click", e => {
    if (dragged) { dragged = false; return; }
    const pk = e.target.closest(".pocket");
    if (pk && pk.dataset.id) { if (has(pk.dataset.id)) openModal(BY_ID[pk.dataset.id]); return; }
    // clic dans la marge d'une page : on la tourne
    if (e.target.closest(".bk-right")) flip(1); else if (e.target.closest(".bk-left")) flip(-1);
  });
}
let bookFlip = null;
addEventListener("keydown", e => {
  if (document.getElementById("view-binder").hidden || !bookFlip || !document.querySelector(".book") || !document.getElementById("modal").hidden) return;
  if (e.key === "ArrowRight") bookFlip(1);
  if (e.key === "ArrowLeft") bookFlip(-1);
});

function renderBinder() {
  const sbox = document.getElementById("binderSets");
  sbox.innerHTML = SETS.map(s => {
    const have = CARDS.filter(c => c.set === s.id && has(c.id)).length;
    return `<button class="chip${s.id === binderSet ? " on" : ""}" data-s="${s.id}">${s.name}<small>${have}/${POOL_SIZE[s.id]}</small></button>`;
  }).join("");
  sbox.querySelectorAll(".chip").forEach(b => b.onclick = () => { binderSet = b.dataset.s; picked = {}; renderBinder(); });

  const fbox = document.getElementById("filters");
  fbox.innerHTML = "";
  FILTERS.forEach(([k, l]) => {
    const b = document.createElement("button"); b.className = "chip" + (filter === k ? " on" : ""); b.textContent = l;
    b.onclick = () => { filter = k; renderBinder(); }; fbox.appendChild(b);
  });

  const cards = CARDS.filter(c => c.set === binderSet);
  const have = cards.filter(c => has(c.id)).length;
  const value = cards.reduce((a, c) => a + priceOf(c) * (save.owned[c.id] || 0), 0) +
    save.graded.filter(x => BY_ID[x.id]?.set === binderSet).reduce((a, x) => a + gradedPrice(x), 0);
  const prog = document.getElementById("prog");
  prog.innerHTML = `<div>${SET[binderSet].name} <b>${have}/${cards.length}</b><div class="bar"><i style="width:${have / cards.length * 100}%"></i></div></div>
    <div>Valeur <b style="color:var(--green)">${fmt(value)}</b></div>
`;
  if (binderSet === "30th") {   // suivi des 30 Pikachu
    const pikas = POOL["30th"].PR, missing = pikas.filter(c => !has(c.id)).map(c => String(c.order - 22).padStart(2, "0"));
    prog.insertAdjacentHTML("beforeend", `<div>Pikachu <b>${30 - missing.length}/30</b><div class="bar"><i style="width:${(30 - missing.length) / 30 * 100}%"></i></div>
      <div class="reward">${save.rewards.pika ? "Récompense reçue ✓" : "Les 30 : +" + fmt(PIKA_REWARD)}</div></div>`);
  }
  const nr = nextReward(binderSet);
  prog.insertAdjacentHTML("beforeend", `<div class="reward">${nr ? `Prochaine récompense : ${nr[0]} % de la série → +${fmt(nr[1])}` : "Série complète, toutes les récompenses reçues ✓"}</div>`);

  // actions : vendre les doublons, actualiser la cote
  const act = document.getElementById("bactions"); act.innerHTML = "";
  const dupes = cards.filter(c => save.owned[c.id] > 1);
  const dupVal = dupes.reduce((a, c) => a + sellPrice(priceOf(c)) * (save.owned[c.id] - 1), 0);
  const sd = document.createElement("button"); sd.className = "btn small ghost";
  sd.textContent = `Vendre les doublons · +${fmt(dupVal)}`; sd.disabled = !dupes.length;
  sd.onclick = () => {
    const n = dupes.reduce((a, c) => a + save.owned[c.id] - 1, 0);
    dupes.forEach(c => save.owned[c.id] = 1);
    gain(dupVal); persist(); updateCounter(true); renderBinder();
    toast(`${n} doublons revendus : +${fmt(dupVal)}`);
  };
  const rf = document.createElement("button"); rf.className = "btn small ghost";
  rf.textContent = "↻ Actualiser la cote";
  rf.title = "Cote actuelle du " + new Date(save.priceDate[binderSet] || PRICE_DATE).toLocaleDateString("fr-FR") + " · récupère les prix du marché en direct";
  rf.onclick = () => refreshPrices(binderSet, rf);
  const sm = document.createElement("button"); sm.className = "btn small" + (selling ? "" : " ghost");
  sm.textContent = selling ? "✕ Quitter le mode vente" : "☑ Choisir les cartes à vendre";
  sm.onclick = () => { selling = !selling; picked = {}; renderBinder(); };
  const bm = document.createElement("button"); bm.className = "btn small ghost";
  bm.textContent = (save.binderMode || "book") === "book" ? "▦ Vue grille" : "📖 Vue classeur";
  bm.onclick = () => { save.binderMode = (save.binderMode || "book") === "book" ? "grid" : "book"; persist(); renderBinder(); };
  if (!selling) act.prepend(bm);
  act.append(sm, sd, rf);
  document.getElementById("view-binder").classList.toggle("selling", selling);

  const box = document.getElementById("binder"); box.innerHTML = "";
  document.querySelector(".sellbar")?.remove();
  let list = cards.filter(c => {
    const own = has(c.id);
    if (filter === "graded") return gradedOf(c.id).length > 0;
    if (filter === "owned" || filter === "value") return own;
    if (filter === "missing") return !own;
    if (filter === "hits") return RARITY[c.rarity].rank >= 2;
    return true;
  });
  list = filter === "value" ? list.sort((a, b) => priceOf(b) - priceOf(a)) : list.sort((a, b) => a.order - b.order);
  if (selling) sellBar(list.filter(c => save.owned[c.id] > 0));
  if (!list.length) { box.innerHTML = `<div class="empty">Rien ici pour l'instant.</div>`; return; }
  bookFlip = null;
  if (!selling && (save.binderMode || "book") === "book") return renderBook(box, list);   // le mode vente reste en grille
  const sec = document.createElement("div"); sec.className = "bsec";
  sec.innerHTML = `<div class="grid"></div>`;
  const grid = sec.querySelector(".grid");
  for (const c of list) {
    const s = document.createElement("div");
    if (has(c.id)) {
      s.className = "slot";
      const raw = save.owned[c.id] || 0, gr = gradedOf(c.id);
      // une carte gradée s'affiche dans son boîtier (la meilleure note si plusieurs)
      s.appendChild(gr.length ? slabEl(c, gr[0], { price: true, lazy: true, tilt: true }) : cardEl(c, { price: true, lazy: true }));
      if (raw + gr.length > 1) s.insertAdjacentHTML("beforeend", `<div class="count">×${raw + gr.length}</div>`);
      if (picked[c.id]) { s.classList.add("picked"); s.insertAdjacentHTML("beforeend", `<div class="pick">Vendre ×${picked[c.id]}</div>`); }
      // en mode vente, chaque clic ajoute un exemplaire, puis revient à zéro
      s.onclick = () => {
        if (!selling) return openModal(c);
        if (!raw) return toast("Les cartes gradées se vendent depuis leur fiche (clic hors mode vente)");
        picked[c.id] = ((picked[c.id] || 0) + 1) % (raw + 1); renderBinder();
      };
    } else {
      s.className = "slot missing";
      s.innerHTML = `<div class="n">${c.num.split(" ")[0]}</div><div>${c.name}</div><div style="color:${RARITY[c.rarity].color}88">${RARITY[c.rarity].sym} · ${fmt(priceOf(c))}</div>`;
    }
    grid.appendChild(s);
  }
  box.appendChild(sec);
}
/* barre du mode vente : raccourcis de sélection sur les cartes affichées + total */
function sellBar(shown) {
  for (const id in picked) if (!picked[id]) delete picked[id];
  const n = Object.values(picked).reduce((a, b) => a + b, 0);
  const total = Object.entries(picked).reduce((a, [id, k]) => a + sellPrice(priceOf(BY_ID[id])) * k, 0);
  const bar = document.createElement("div"); bar.className = "sellbar";
  bar.innerHTML = `<div class="sum">${n ? `${n} carte${n > 1 ? "s" : ""} · <b>+${fmt(total)}</b>` : `${TAP} sur les cartes à vendre`}</div>`;
  const pickAll = (fn, label) => {
    const b = document.createElement("button"); b.className = "btn small ghost"; b.textContent = label;
    b.onclick = () => { shown.forEach(c => { const k = fn(c); if (k > 0) picked[c.id] = k; }); renderBinder(); };
    bar.appendChild(b);
  };
  pickAll(c => save.owned[c.id] - 1, "Doublons");
  pickAll(c => priceOf(c) < 1_00 ? save.owned[c.id] : 0, "Moins de 1 $");
  pickAll(c => save.owned[c.id], "Tout");
  const clr = document.createElement("button"); clr.className = "btn small ghost"; clr.textContent = "Vider";
  clr.disabled = !n; clr.onclick = () => { picked = {}; renderBinder(); };
  const go = document.createElement("button"); go.className = "btn small green"; go.textContent = "Vendre";
  go.disabled = !n;
  go.onclick = () => {
    for (const [id, k] of Object.entries(picked)) removeCard(id, Math.min(k, save.owned[id] || 0));
    gain(total); picked = {}; persist(); updateCounter(true); renderBinder();
    toast(`${n} carte${n > 1 ? "s" : ""} vendue${n > 1 ? "s" : ""} : +${fmt(total)}`);
  };
  bar.append(clr, go);
  document.body.appendChild(bar);
}
const POOL_SIZE = Object.fromEntries(SETS.map(s => [s.id, CARDS.filter(c => c.set === s.id).length]));

/* ---------- Cote en direct : API TCGdex (TCGplayer en $, sinon Cardmarket en € converti) ---------- */
const EUR_USD = 1.17;
function usdFrom(pricing) {
  const tp = pricing?.tcgplayer || {};
  for (const k of ["holofoil", "normal", "unlimitedHolofoil", "unlimited", "1stEditionHolofoil", "1stEdition", "reverse-holofoil"])
    if (tp[k]?.marketPrice) return Math.round(tp[k].marketPrice * 100);
  const cm = pricing?.cardmarket || {}, eur = cm.avg30 || cm.trend || cm.avg;
  return eur ? Math.max(2, Math.round(eur * EUR_USD * 100)) : null;
}
let refreshing = false;
async function refreshPrices(setId, btn) {
  if (refreshing) return;
  refreshing = true;
  const list = CARDS.filter(c => c.set === setId && c.tcg), queue = [...list];
  let done = 0, changed = 0, ok = 0;
  btn.disabled = true;
  await Promise.all(Array.from({ length: 8 }, async () => {
    while (queue.length) {
      const c = queue.shift();
      try {
        const r = await fetch(`https://api.tcgdex.net/v2/en/cards/${c.tcg}`);
        const p = usdFrom((await r.json()).pricing);
        if (p) { ok++; if (p !== priceOf(c)) changed++; save.prices[c.id] = p; }
      } catch (e) {}
      btn.textContent = `Actualisation… ${++done}/${list.length}`;
    }
  }));
  refreshing = false;
  if (ok) { save.priceDate[setId] = new Date().toISOString().slice(0, 10); persist(); }
  updateCounter();
  if (!document.getElementById("view-binder").hidden) renderBinder();
  toast(ok ? `Cote à jour : ${changed} prix ont bougé` : "Impossible de joindre le marché (pas d'internet ?)");
}

/* ---------- Zoom carte : vente, grading ---------- */
function openModal(c, show = null) {
  const m = document.getElementById("modal"), R = RARITY[c.rarity], n = save.owned[c.id] || 0, gr = gradedOf(c.id);
  const odds = cardOdds(c);
  m.innerHTML = `<div class="mwrap"><div class="mcard"></div>
    <div class="minfo" style="--rc:${R.color}">${c.name} · ${c.num} · ${SET[c.set].name}<br>
      <span class="r">${R.sym} ${R.label}</span>${n ? ` · ×${n}` : ""}${gr.length ? ` · ${gr.length} gradée${gr.length > 1 ? "s" : ""}` : ""}<br>
      <span class="cote">${fmt(priceOf(c))}</span><br>
      <span style="color:var(--muted);font-size:13px">${odds}</span></div>
    <div class="controls" style="margin:0"></div><div class="graded-list"></div></div>`;
  const shown = show || (!n && gr[0]);
  const mc = m.querySelector(".mcard");
  mc.classList.toggle("slabbed", !!shown);
  mc.appendChild(shown ? slabEl(c, shown, { tilt: true }) : cardEl(c));
  const ctr = m.querySelector(".controls"), refresh = () => { updateCounter(true); if (!document.getElementById("view-binder").hidden) renderBinder(); };
  if (n) {
    const b = document.createElement("button"); b.className = "btn green";
    b.textContent = `Vendre 1 · +${fmt(sellPrice(priceOf(c)))}`;
    b.onclick = () => {
      removeCard(c.id); gain(sellPrice(priceOf(c))); persist(); refresh();
      toast(`${c.name} vendue : +${fmt(sellPrice(priceOf(c)))}`);
      closeModal();
    };
    const g = document.createElement("button"); g.className = "btn";
    g.textContent = `Grader 1 · ${fmt(GRADE_COST)}`;
    g.onclick = () => gradeCard(c, g);
    ctr.append(g, b);
  }
  // les exemplaires gradés : un bouton chacun pour le voir et le vendre
  const gl = m.querySelector(".graded-list");
  gr.forEach(x => {
    const v = document.createElement("button"); v.className = "btn small ghost";
    v.textContent = `${GRADER} ${x.g}`; v.onclick = () => openModal(c, x);
    const sb = document.createElement("button"); sb.className = "btn small green";
    sb.textContent = `Vendre la ${x.g} · +${fmt(sellPrice(gradedPrice(x)))}`;
    sb.onclick = () => {
      save.graded = save.graded.filter(y => y.u !== x.u); gain(sellPrice(gradedPrice(x))); persist(); refresh();
      toast(`${c.name} ${GRADER} ${x.g} vendue : +${fmt(sellPrice(gradedPrice(x)))}`);
      closeModal();
    };
    gl.append(v, sb);
  });
  m.hidden = false;
  m.onclick = e => { if (!e.target.closest(".mcard") && !e.target.closest(".btn")) closeModal(); };
}
function rollGrade() {
  let x = Math.random();
  for (const g of GRADES) { if (x < g[2]) return g[0]; x -= g[2]; }
  return 8;
}
let grading = false;
async function gradeCard(c, btn) {
  if (grading) return;
  if (!(save.owned[c.id] > 0)) return;
  if (!pay(GRADE_COST)) return nope(btn, `Le grading coûte ${fmt(GRADE_COST)}`);
  grading = true;
  const x = { u: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), id: c.id, g: rollGrade() };
  removeCard(c.id); save.graded.push(x); persist(); updateCounter(true);
  // suspense : la note défile avant d'être révélée
  const m = document.getElementById("modal"), box = m.querySelector(".mcard");
  m.querySelectorAll(".controls, .graded-list").forEach(b => b.style.visibility = "hidden");
  box.innerHTML = ""; box.classList.add("slabbed");
  const el = slabEl(c, x); el.classList.add("reveal"); box.appendChild(el);
  m.querySelector(".minfo").innerHTML = `${c.name} · mise sous boîtier…`;
  await wait(2900);
  grading = false;
  openModal(c, x);
  // le classeur derrière la fiche se met à jour tout seul (boîtier, compteur, valeur)
  if (!document.getElementById("view-binder").hidden) renderBinder();
  const G = GRADE[x.g], r = m.querySelector(".mcard").getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const diff = gradedPrice(x) - priceOf(c), sub = `${c.name} · ${fmt(gradedPrice(x))} (${diff >= 0 ? "+" : "−"}${fmt(Math.abs(diff))})`;
  if (x.g === 10) { flash("#ffd76a"); shockwave(cx, cy, ["#ffd76a", "#fff", "#c8102e"]); banner(`${GRADER} 10 · GEM MINT !`, "#ffd76a", sub); }
  else if (x.g === 9) { burst(cx, cy, ["#4ce08a", "#fff"], 90, 10); banner(`${GRADER} 9 · MINT`, "#4ce08a", sub); }
  else if (x.g <= 6) { banner(`${GRADER} ${x.g} · ${G[1]}`, "#ff6b6b", sub); }
  else toast(`${GRADER} ${x.g} · ${G[1]} : la cote ne bouge pas`);
}
function closeModal() { document.getElementById("modal").hidden = true; }

/* =====================================================================
   STATS
   ===================================================================== */
let resetArmed = false, statsSet = "30th";
function renderStats() {
  const coll = ownedValue(), sealed = sealedValue();
  const net = save.money + coll + sealed - START_MONEY;
  const totalPacks = Object.values(save.packs).reduce((a, b) => a + b, 0);
  const set = SET[statsSet], packs = save.packs[statsSet] || 0, pulled = save.pulled[statsSet] || {};
  const rar = [...new Set(CARDS.filter(c => c.set === statsSet).map(c => c.rarity))].sort((a, b) => RARITY[a].rank - RARITY[b].rank);
  const box = document.getElementById("stats");
  box.innerHTML = `
    <div class="tiles">
      <div class="tile"><div class="v" style="color:var(--green)">${fmt(save.money)}</div><div class="l">argent disponible</div></div>
      <div class="tile"><div class="v">${fmt(coll)}</div><div class="l">valeur de la collection</div></div>
      <div class="tile"><div class="v">${fmt(sealed)}</div><div class="l">valeur du scellé</div></div>
      <div class="tile"><div class="v ${net >= 0 ? "up" : "down"}">${net >= 0 ? "+" : "−"}${fmt(Math.abs(net))}</div><div class="l">bilan (départ : ${fmt(START_MONEY)})</div></div>
      <div class="tile"><div class="v">${totalPacks}</div><div class="l">boosters ouverts</div></div>
      <div class="tile"><div class="v">${fmt(save.spent)}</div><div class="l">dépensé en boutique</div></div>
      <div class="tile"><div class="v">${fmt(save.earned)}</div><div class="l">gagné en reventes</div></div>
      <div class="tile"><div class="v">${fmt(save.bonus)}</div><div class="l">bonus reçus (cadeaux, récompenses)</div></div>
      <div class="tile"><div class="v">${save.graded.length}</div><div class="l">cartes gradées${save.graded.length ? " · " + GRADES.map(g => save.graded.filter(x => x.g === g[0]).length + "×" + g[0]).filter(t => !t.startsWith("0×")).join(" ") : ""}</div></div>
    </div>
    <div class="setchips" style="margin:6px 0 0;justify-content:flex-start">${SETS.map(s => `<button class="chip${s.id === statsSet ? " on" : ""}" data-s="${s.id}">${s.name}<small>${save.packs[s.id] || 0}</small></button>`).join("")}</div>
    <table class="rtable">
      <tr><th>Rareté</th><th>Tirées</th><th>Ton taux</th><th>Taux réel (communauté)</th></tr>
      ${rar.map(r => {
        const n = pulled[r] || 0, R = RARITY[r];
        const hs = set.hit.find(h => h[0] === r);
        const announced = hs ? "1 / " + String(+(1 / hs[1]).toFixed(1)).replace(".", ",") + " boosters"
          : r === set.fallback ? "quand pas de hit" : "dans chaque booster";
        const mine = packs ? (n ? "1 / " + (packs / n).toFixed(1).replace(".", ",") + " boosters" : "—") : "—";
        return `<tr style="--rc:${R.color}"><td><span class="dot"></span>${R.label}</td><td>${n}</td><td>${mine}</td><td style="color:var(--muted)">${announced}</td></tr>`;
      }).join("")}
    </table>
    <div><h3 style="margin:6px 0 10px">Derniers hits</h3><div class="hits" id="hits"></div></div>
    <div><button class="btn ghost" id="reset">Tout recommencer (${fmt(START_MONEY)}, collection vide)</button></div>`;
  box.querySelectorAll(".setchips .chip").forEach(b => b.onclick = () => { statsSet = b.dataset.s; renderStats(); });
  const hits = box.querySelector("#hits");
  if (!save.hits.length) hits.innerHTML = `<span style="color:var(--muted)">Pas encore de hit… ouvre des boosters !</span>`;
  save.hits.forEach(id => { const c = BY_ID[id]; if (!c) return; const s = document.createElement("div"); s.className = "slot"; s.appendChild(cardEl(c, { price: true })); s.onclick = () => openModal(c); hits.appendChild(s); });
  const rb = box.querySelector("#reset");
  rb.onclick = () => {
    if (!resetArmed) { resetArmed = true; rb.textContent = `Sûr ? ${TAP} encore pour tout effacer`; setTimeout(() => { resetArmed = false; rb.textContent = `Tout recommencer (${fmt(START_MONEY)}, collection vide)`; }, 3000); return; }
    save = fresh(); persist(); updateCounter(); resetArmed = false; resetStage(); renderStats();
  };
}

/* =====================================================================
   BONUS : récompenses de collection et cadeau du jour
   ===================================================================== */
const coverage = setId => CARDS.filter(c => c.set === setId && has(c.id)).length / POOL_SIZE[setId] * 100;
const nextReward = setId => REWARDS.find(([pct]) => !save.rewards[setId + ":" + pct]);
function checkRewards() {
  for (const s of SETS) if (s.unlock && isUnlocked(s.id) && !save.unlocked.includes(s.id)) {
    save.unlocked.push(s.id); persist();
    bannerLater(`${s.name} débloquée !`, s.color, "Nouvelle série dans la boutique · " + s.unlock.toLocaleString("fr-FR") + " boosters ouverts");
  }
  for (const s of SETS) {
    const cov = coverage(s.id);
    for (const [pct, amount] of REWARDS) {
      const key = s.id + ":" + pct;
      if (save.rewards[key] || cov < pct) continue;
      save.rewards[key] = Date.now(); bonus(amount); persist();
      bannerLater(`${s.name} à ${pct} % !`, s.color, "Récompense de collection · +" + fmt(amount));
    }
  }
  if (!save.rewards.pika && POOL["30th"].PR.every(c => has(c.id))) {
    save.rewards.pika = Date.now(); bonus(PIKA_REWARD); persist();
    bannerLater("Les 30 Pikachu !", "#ffd21f", "Récompense de collection · +" + fmt(PIKA_REWARD));
  }
}
const today = () => new Date().toLocaleDateString("sv");   // AAAA-MM-JJ, à l'heure locale
/* boosters gratuits : recharge + compte à rebours, vérifiés chaque seconde */
function freeTick() {
  if (!save.free && Date.now() >= save.freeAt) {
    save.free = FREE_COUNT; bonus(FREE_CASH); persist(); updateCounter(true);
    bannerLater("10 boosters gratuits !", "#5ad19a", `+ ${fmt(FREE_CASH)} · ils t'attendent dans l'onglet Ouvrir`);
    if (state === "pack" && !document.getElementById("view-open").hidden) renderPicker();
  }
  for (const id of ["freeTimer", "freeTimer2"]) { const t = document.getElementById(id); if (t) t.textContent = mmss(save.freeAt - Date.now()); }
}
setInterval(freeTick, 1000);
function dailyGift() {
  if (save.gift === today()) return;
  save.gift = today(); bonus(DAILY_GIFT); persist();
  bannerLater("Cadeau du jour", "#4ce08a", "+" + fmt(DAILY_GIFT) + " · reviens demain !");
}

/* =====================================================================
   NAVIGATION
   ===================================================================== */
let lastMoney = save.money;
function updateCounter(bump = false) {
  checkRewards();
  const total = Object.values(save.boosters).reduce((a, b) => a + b, 0) + save.free;
  const badge = document.getElementById("cPacks");
  badge.textContent = total; badge.hidden = !total;
  const m = document.getElementById("money");
  m.textContent = fmt(save.money);
  m.classList.toggle("bad", save.money < 10_00);
  if (bump || save.money !== lastMoney) { m.classList.add("bump"); setTimeout(() => m.classList.remove("bump"), 180); }
  lastMoney = save.money;
  document.getElementById("collVal").textContent = fmt(ownedValue());
}
function show(v) {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  ["shop", "open", "reserve", "binder", "stats"].forEach(k => document.getElementById("view-" + k).hidden = k !== v);
  if (v !== "reserve") closeVault();
  if (v !== "binder") { selling = false; picked = {}; document.querySelector(".sellbar")?.remove(); }
  if (v === "shop") renderShop();
  if (v === "open") { if (state === "summary") resetStage(); else if (state === "pack") renderPicker(); }
  if (v === "binder") renderBinder();
  if (v === "reserve") renderReserve();
  if (v === "stats") renderStats();
  scrollTo(0, 0);
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => show(b.dataset.view));
updateCounter();
// premier lancement : direction la boutique
show(save.free || Object.values(save.boosters).some(n => n > 0) ? "open" : "shop");
if (topUp) { persist(); bannerLater("Nouveau départ : " + fmt(START_MONEY), "#5ad19a", "+" + fmt(topUp) + " ajoutés à ta partie"); }
freeTick(); dailyGift(); updateCounter();
</script>
